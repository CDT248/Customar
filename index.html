<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(0,255,170,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(0,140,255,.20),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020617,
            #071b2e,
            #061b16
        );

    overflow:hidden;

    color:white;
}


/* BACKGROUND */

.bg-circle{

    position:fixed;

    border-radius:50%;

    filter:blur(2px);

    pointer-events:none;
}

.c1{

    width:280px;
    height:280px;

    left:-100px;
    top:-80px;

    background:
        rgba(0,255,170,.12);

}

.c2{

    width:350px;
    height:350px;

    right:-140px;
    bottom:-120px;

    background:
        rgba(0,140,255,.12);

}


/* LOGIN CARD */

.login-card{

    width:100%;

    max-width:390px;

    padding:34px 30px;

    background:
        rgba(10,20,32,.88);

    border:1px solid
        rgba(255,255,255,.12);

    border-radius:24px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(18px);

    position:relative;

    z-index:5;

}


/* LOGO */

.logo{

    width:78px;

    height:78px;

    margin:0 auto 18px;

    border-radius:22px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:34px;

    background:
        linear-gradient(
            135deg,
            #00d084,
            #008cff
        );

    box-shadow:
        0 12px 35px
        rgba(0,180,255,.25);

}


/* TITLE */

h1{

    text-align:center;

    font-size:26px;

    margin-bottom:7px;

}

.subtitle{

    text-align:center;

    color:#9ca3af;

    font-size:13px;

    margin-bottom:28px;

}


/* INPUT */

.input-group{

    margin-bottom:17px;

}

.input-group label{

    display:block;

    font-size:12px;

    font-weight:bold;

    color:#aeb8c4;

    margin-bottom:8px;

    letter-spacing:.4px;

}

.input-wrap{

    position:relative;

}

.input-icon{

    position:absolute;

    left:14px;

    top:50%;

    transform:
        translateY(-50%);

    color:#8b98a8;

    font-size:16px;

}

input{

    width:100%;

    height:48px;

    padding:
        0 15px 0 43px;

    border-radius:12px;

    border:1px solid
        rgba(255,255,255,.10);

    outline:none;

    background:
        rgba(255,255,255,.055);

    color:white;

    font-size:14px;

    transition:.25s;

}

input::placeholder{

    color:#6f7b89;

}

input:focus{

    border-color:#00d084;

    box-shadow:
        0 0 0 3px
        rgba(0,208,132,.10);

}


/* PASSWORD BUTTON */

.password-toggle{

    position:absolute;

    right:10px;

    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:none;

    color:#8995a3;

    cursor:pointer;

    font-size:15px;

}


/* LOGIN BUTTON */

.login-btn{

    width:100%;

    height:49px;

    margin-top:7px;

    border:0;

    border-radius:12px;

    cursor:pointer;

    color:white;

    font-size:14px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #00c878,
            #008cff
        );

    box-shadow:
        0 12px 30px
        rgba(0,170,220,.20);

    transition:.25s;

}

.login-btn:hover{

    transform:
        translateY(-1px);

    box-shadow:
        0 16px 35px
        rgba(0,170,220,.32);

}

.login-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


/* MESSAGE */

.message{

    min-height:20px;

    margin-top:15px;

    text-align:center;

    font-size:12px;

    font-weight:bold;

}

.message.error{

    color:#ff6b6b;

}

.message.success{

    color:#35e89a;

}


/* FOOTER */

.footer{

    text-align:center;

    color:#667384;

    font-size:10px;

    margin-top:22px;

}


@media(max-width:450px){

    .login-card{

        padding:30px 22px;

        border-radius:21px;

    }

    h1{

        font-size:23px;

    }

}

</style>

</head>


<body>


<div class="bg-circle c1"></div>
<div class="bg-circle c2"></div>


<div class="login-card">


    <div class="logo">
        🔐
    </div>


    <h1>
        Customer Login
    </h1>


    <div class="subtitle">
        Sign in to access your customer portal
    </div>


    <div class="input-group">

        <label>
            USERNAME
        </label>

        <div class="input-wrap">

            <span class="input-icon">
                👤
            </span>

            <input
                id="username"
                type="text"
                placeholder="Enter username"
                autocomplete="username">

        </div>

    </div>


    <div class="input-group">

        <label>
            PASSWORD
        </label>

        <div class="input-wrap">

            <span class="input-icon">
                🔒
            </span>

            <input
                id="password"
                type="password"
                placeholder="Enter password"
                autocomplete="current-password">

            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
                id="passwordToggle">

                👁

            </button>

        </div>

    </div>


    <button
        id="loginButton"
        class="login-btn"
        onclick="login()">

        LOGIN

    </button>


    <div
        id="message"
        class="message">
    </div>


    <div class="footer">
        Customer Portal
    </div>


</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwEda0meR5ZzPbUZqH_5dpbIQWt1Z7fArv6adM5yRMGMDYwOkkZn-O1bZ0v4xHFTuGmwA/exec";


/* =====================================================
   IF ALREADY LOGGED IN
===================================================== */

(function(){

    const localLogin =
        localStorage.getItem("loggedIn");

    const sessionLogin =
        sessionStorage.getItem("loggedIn");


    if(
        localLogin === "true" ||
        sessionLogin === "true"
    ){

        window.location.replace(
            "ds.html"
        );

    }

})();


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document.getElementById("username")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            document.getElementById(
                "password"
            ).focus();

        }

    }
);


document.getElementById("password")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            login();

        }

    }
);


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

function togglePassword(){

    const password =
        document.getElementById(
            "password"
        );

    const button =
        document.getElementById(
            "passwordToggle"
        );


    if(password.type === "password"){

        password.type = "text";

        button.textContent = "🙈";

    }

    else{

        password.type = "password";

        button.textContent = "👁";

    }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value.trim();


    const button =
        document.getElementById(
            "loginButton"
        );


    if(!username){

        showMessage(
            "Please enter username.",
            "error"
        );

        return;

    }


    if(!password){

        showMessage(
            "Please enter password.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "LOGINNING...";


    showMessage(
        "Checking login...",
        ""
    );


    try{

        /*
        ==========================================
        Apps Script
        ==========================================
        */

        const url =
            API_URL +
            "?action=login" +
            "&username=" +
            encodeURIComponent(username) +
            "&password=" +
            encodeURIComponent(password);


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const result =
            await response.json();


        console.log(
            "LOGIN RESPONSE:",
            result
        );


        /*
        ==========================================
        LOGIN SUCCESS
        ==========================================
        */

        if(
            result.success === true ||
            result.status === "success" ||
            result.login === true
        ){

            const finalUsername =
                result.username ||
                result.user ||
                username;


            /*
            IMPORTANT:
            দুটো storage-তেই save করছি।
            */

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            localStorage.setItem(
                "username",
                finalUsername
            );


            sessionStorage.setItem(
                "loggedIn",
                "true"
            );


            sessionStorage.setItem(
                "username",
                finalUsername
            );


            /*
            Small delay যাতে storage
            properly save হয়।
            */

            showMessage(
                "Login successful.",
                "success"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "ds.html"
                    );

                },
                250
            );


            return;

        }


        /*
        ==========================================
        LOGIN FAILED
        ==========================================
        */

        showMessage(
            result.message ||
            "Invalid username or password.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "LOGIN";

    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(
            "Unable to connect to server.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "LOGIN";

    }

}

</script>

</body>

</html>
