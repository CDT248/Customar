<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b5d3b, #063d28);
    }

    .login-box {
      width: 90%;
      max-width: 380px;
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #0b5d3b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h2 {
      text-align: center;
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #0b5d3b;
      box-shadow: 0 0 0 3px rgba(11, 93, 59, 0.1);
    }

    button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: #0b5d3b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #08492f;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      background: #ffe5e5;
      color: #d60000;
      text-align: center;
      font-size: 14px;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 8px;
      background: #e4f8ed;
      color: #08783d;
      text-align: center;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">A</div>

    <h2>Admin Login</h2>
    <div class="subtitle">Login to continue</div>

    <form id="loginForm">

      <div class="input-group">
        <label>Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="username"
          required
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit">LOGIN</button>

      <div class="error" id="error">
        ❌ Invalid Username or Password
      </div>

      <div class="success" id="success">
        ✅ Login Successful
      </div>

    </form>

    <div class="footer">
      Admin Panel
    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const errorBox = document.getElementById("error");
    const successBox = document.getElementById("success");

    loginForm.addEventListener("submit", function(e) {

      e.preventDefault();

      const username = document
        .getElementById("username")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      errorBox.style.display = "none";
      successBox.style.display = "none";

      if (username === "ADMIN" && password === "12345") {

        successBox.style.display = "block";

        // Login session
        sessionStorage.setItem("loggedIn", "true");
        sessionStorage.setItem("username", "ADMIN");

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 500);

      } else {

        errorBox.style.display = "block";

      }

    });
  </script>

</body>
</html>
