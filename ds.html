<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#222;
    --muted:#777;
    --border:#dddddd;
    --green:#0b5d3b;
}

body.dark{
    --bg:#000000;
    --card:#111111;
    --text:#ffffff;
    --muted:#aaaaaa;
    --border:#292929;
    --green:#19a866;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}


/* =====================================================
   THEME BUTTON
===================================================== */

.theme-button{

    position:fixed;

    top:7px;
    right:7px;

    width:28px;
    height:28px;

    border:1px solid var(--border);

    border-radius:50%;

    background:var(--card);

    color:var(--text);

    font-size:13px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:9999;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:65px;

    background:var(--card);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    border-bottom:1px solid var(--border);

    position:sticky;

    top:0;

    z-index:100;
}

.title{

    font-size:20px;

    font-weight:bold;

    color:var(--green);
}

.logout{

    border:0;

    background:var(--green);

    color:white;

    padding:10px 17px;

    border-radius:8px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    position:fixed;

    inset:0;

    background:var(--bg);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:5000;
}

.loading-box{

    text-align:center;

    background:var(--card);

    border:1px solid var(--border);

    padding:28px 35px;

    border-radius:18px;

    box-shadow:0 15px 45px rgba(0,0,0,.15);
}

.loader{

    width:35px;

    height:35px;

    margin:0 auto 13px;

    border:4px solid var(--border);

    border-top-color:var(--green);

    border-radius:50%;

    animation:spin .8s linear infinite;
}

.loading-text{

    font-size:13px;

    font-weight:bold;

    color:var(--muted);
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:22px 16px 40px;
}


/* =====================================================
   USERNAME PASSWORD
===================================================== */

.top{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:12px;
}

.box{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;
}

.label{

    font-size:12px;

    font-weight:bold;

    color:var(--muted);

    margin-bottom:7px;
}

.value{

    font-size:16px;

    font-weight:bold;

    color:var(--text);

    word-break:break-word;
}


/* =====================================================
   MAC
===================================================== */

.mac-box{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:18px;
}

.mac-title{

    font-size:12px;

    color:var(--muted);

    font-weight:bold;

    margin-bottom:7px;
}

.mac-value{

    font-size:17px;

    font-weight:bold;

    color:var(--text);

    word-break:break-all;
}


/* =====================================================
   PHOTO
===================================================== */

.photo-box{

    width:100%;

    display:flex;

    justify-content:center;

    margin:5px 0 22px;
}

.photo{

    width:200px;

    height:200px;

    border-radius:50%;

    overflow:hidden;

    background:#dff0e8;

    border:6px solid var(--card);

    box-shadow:
        0 7px 30px rgba(0,0,0,.18);
}

.photo img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:none;
}

.photo svg{

    width:100%;

    height:100%;

    display:block;
}


/* =====================================================
   SPEED BOX
===================================================== */

.speed-box{

    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--bg)
        );

    border:1px solid var(--border);

    border-radius:18px;

    padding:17px;

    margin-bottom:14px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.06);
}


/* =====================================================
   SPEED HEADER
===================================================== */

.speed-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    cursor:pointer;

    user-select:none;

    margin-bottom:15px;
}

.speed-title{

    display:flex;

    align-items:center;

    gap:7px;

    font-size:14px;

    font-weight:bold;

    color:var(--muted);
}

.speed-arrow{

    font-size:10px;

    transition:.3s;

    color:var(--muted);
}

.speed-live{

    display:flex;

    align-items:center;

    gap:5px;

    font-size:10px;

    font-weight:bold;

    color:#08783d;

    background:#e8f7ef;

    padding:6px 9px;

    border-radius:20px;
}

.live-dot{

    width:6px;

    height:6px;

    background:#0aa854;

    border-radius:50%;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{

    0%{
        opacity:.4;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.2);
    }

    100%{
        opacity:.4;
        transform:scale(.8);
    }

}


/* =====================================================
   SPEED CONTENT
===================================================== */

.speed-content{

    max-height:600px;

    overflow:hidden;

    opacity:1;

    transition:
        max-height .4s ease,
        opacity .25s ease;
}

.speed-box.minimized .speed-content{

    max-height:0;

    opacity:0;

    pointer-events:none;
}

.speed-box.minimized .speed-header{

    margin-bottom:0;
}

.speed-box.minimized .speed-arrow{

    transform:rotate(-90deg);
}


/* =====================================================
   SPEED VALUES
===================================================== */

.speed-values{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:15px;
}

.speed-value-box{

    border:1px solid var(--border);

    border-radius:13px;

    padding:13px;

    background:var(--bg);

    position:relative;

    overflow:hidden;
}

.speed-value-box::after{

    content:"";

    position:absolute;

    width:60px;

    height:60px;

    border-radius:50%;

    right:-25px;

    bottom:-25px;

    opacity:.08;
}

.download-card::after{
    background:#e00000;
}

.upload-card::after{
    background:#0b9b54;
}

.speed-value-title{

    font-size:10px;

    font-weight:bold;

    margin-bottom:5px;

    letter-spacing:.5px;
}

.download-title{
    color:#e00000;
}

.upload-title{
    color:#0b9b54;
}

.speed-number-row{

    display:flex;

    align-items:baseline;

    gap:5px;
}

.speed-value{

    font-size:25px;

    font-weight:bold;

    color:var(--text);
}

.speed-unit{

    font-size:10px;

    color:var(--muted);

    font-weight:bold;
}


/* =====================================================
   LEGEND
===================================================== */

.graph-legend{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:28px;

    margin-bottom:9px;
}

.legend{

    display:flex;

    align-items:center;

    gap:6px;

    font-size:11px;

    font-weight:bold;

    color:var(--text);
}

.legend-line{

    width:24px;

    height:3px;

    border-radius:20px;
}

.download-line{

    background:#e00000;

    box-shadow:
        0 0 7px rgba(224,0,0,.4);
}

.upload-line{

    background:#0b9b54;

    box-shadow:
        0 0 7px rgba(11,155,84,.4);
}


/* =====================================================
   GRAPH
===================================================== */

.graph-container{

    width:100%;

    height:200px;

    position:relative;

    border-radius:13px;

    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            rgba(128,128,128,.02),
            rgba(128,128,128,.08)
        );

    border:1px solid var(--border);
}

#speedCanvas{

    width:100%;

    height:100%;

    display:block;
}

.speed-note{

    text-align:center;

    font-size:10px;

    color:var(--muted);

    margin-top:8px;
}


/* =====================================================
   INFO BOXES
===================================================== */

.info,
.billing,
.bill,
.address,
.connection{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:12px;
}

.info-title{

    font-size:12px;

    color:var(--muted);

    font-weight:bold;

    margin-bottom:7px;
}

.info-value{

    font-size:17px;

    font-weight:bold;

    line-height:1.4;

    color:var(--text);

    word-break:break-word;
}

.bill-value{

    font-size:22px;

    font-weight:bold;

    color:var(--green);
}


/* =====================================================
   ONLINE
===================================================== */

.online{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:7px 11px;

    background:#e8f7ef;

    color:#08783d;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;
}

.online-dot{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#0aa854;

    box-shadow:
        0 0 7px #0aa854;

    animation:onlinePulse 1.3s infinite;
}

@keyframes onlinePulse{

    0%,100%{
        opacity:.6;
    }

    50%{
        opacity:1;
    }

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    display:none;

    background:#fff0f0;

    color:#c62828;

    border:1px solid #ffcaca;

    padding:14px;

    border-radius:12px;

    text-align:center;

    font-size:13px;

    font-weight:bold;

    margin-bottom:15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    .header{

        height:60px;

        padding:0 14px;
    }

    .title{

        font-size:18px;
    }

    .logout{

        padding:9px 13px;
    }

    .container{

        padding:18px 13px 30px;
    }

    .photo{

        width:190px;

        height:190px;
    }

    .value{

        font-size:14px;
    }

    .mac-value{

        font-size:15px;
    }

    .info-value{

        font-size:15px;
    }

    .speed-value{

        font-size:21px;
    }

    .graph-container{

        height:185px;
    }

}

</style>

</head>


<body>

<div class="container">

<!-- USERNAME + PASSWORD -->

<script>


/* =====================================================
   API URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwEda0meR5ZzPbUZqH_5dpbIQWt1Z7fArv6adM5yRMGMDYwOkkZn-O1bZ0v4xHFTuGmwA/exec";


/* =====================================================
   LOGIN CHECK
===================================================== */

const loggedIn =
sessionStorage.getItem("loggedIn") === "true" ||
localStorage.getItem("loggedIn") === "true";


if(!loggedIn){

    window.location.replace("index.html");

}


/* =====================================================
   GET USERNAME
===================================================== */

const currentUsername =
sessionStorage.getItem("username") ||
localStorage.getItem("username");


if(!currentUsername){

    window.location.replace("index.html");

}


/* =====================================================
   HELPER
===================================================== */

function findValue(data, names){

    if(!data){

        return "";

    }


    const keys =
        Object.keys(data);


    for(
        const name of names
    ){

        const wanted =
            String(name)
            .toLowerCase()
            .replace(/[\s_-]/g,"");


        for(
            const key of keys
        ){

            const normalized =
                String(key)
                .toLowerCase()
                .replace(/[\s_-]/g,"");


            if(normalized === wanted){

                return data[key];

            }

        }

    }


    return "";

}


/* =====================================================
   LOAD CUSTOMER DATA
===================================================== */

async function loadCustomerData(){

    try{

        const url =
            API_URL +
            "?action=getUser" +
            "&username=" +
            encodeURIComponent(
                currentUsername
            ) +
            "&_=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const result =
            await response.json();


        console.log(
            "CUSTOMER DATA:",
            result
        );


        if(
            !result ||
            result.success !== true
        ){

            throw new Error(
                result &&
                result.message
                ? result.message
                : "Customer data not found."
            );

        }


        const data =
            result.data || {};


        /*
        ===============================
        USERNAME
        ===============================
        */

        const username =
            findValue(
                data,
                [
                    "Username",
                    "username"
                ]
            ) ||
            currentUsername;


        document.getElementById(
            "username"
        ).textContent =
            username;


        /*
        ===============================
        PASSWORD
        ===============================
        */

        const password =
            findValue(
                data,
                [
                    "Password",
                    "password"
                ]
            );


        document.getElementById(
            "password"
        ).textContent =
            password || "••••••";


        /*
        ===============================
        MAC
        ===============================
        */

        const mac =
            findValue(
                data,
                [
                    "MAC",
                    "Mac",
                    "Mac Address",
                    "MAC Address"
                ]
            );


        document.getElementById(
            "mac"
        ).textContent =
            mac || "Not available";


        /*
        ===============================
        NAME
        ===============================
        */

        const name =
            findValue(
                data,
                [
                    "Name",
                    "Customer Name"
                ]
            );


        document.getElementById(
            "name"
        ).textContent =
            name || "Not available";


        /*
        ===============================
        DOWNLOAD
        ===============================
        */

        const download =
            findValue(
                data,
                [
                    "Download",
                    "Download Mbps",
                    "Download Speed"
                ]
            );


        if(download){

            downloadBase =
                parseFloat(
                    String(download)
                    .replace(/[^\d.]/g,"")
                ) || 7;

        }


        /*
        ===============================
        UPLOAD
        ===============================
        */

        const upload =
            findValue(
                data,
                [
                    "Upload",
                    "Upload Mbps",
                    "Upload Speed"
                ]
            );


        if(upload){

            uploadBase =
                parseFloat(
                    String(upload)
                    .replace(/[^\d.]/g,"")
                ) || 1.5;

        }


        /*
        ===============================
        BILLING DATE
        ===============================
        */

        const billingDate =
            findValue(
                data,
                [
                    "Billing Date",
                    "BillingDate",
                    "Bill Date",
                    "Renew Date"
                ]
            );


        document.getElementById(
            "billingDate"
        ).textContent =
            billingDate || "Not available";


        /*
        ===============================
        BILL
        ===============================
        */

        const bill =
            findValue(
                data,
                [
                    "Bill",
                    "Customer Bill",
                    "Amount"
                ]
            );


        document.getElementById(
            "bill"
        ).textContent =
            bill
            ? String(bill).includes("tk")
                ? bill
                : bill + " tk"
            : "Not available";


        /*
        ===============================
        ADDRESS
        ===============================
        */

        const address =
            findValue(
                data,
                [
                    "Address",
                    "Customer Address"
                ]
            );


        document.getElementById(
            "address"
        ).textContent =
            address || "Not available";


        /*
        ===============================
        PHOTO
        ===============================
        */

        const photo =
            findValue(
                data,
                [
                    "Photo",
                    "Picture",
                    "Photo URL",
                    "Picture URL",
                    "Image"
                ]
            );


        if(photo){

            const image =
                document.getElementById(
                    "profilePhoto"
                );

            const defaultPhoto =
                document.getElementById(
                    "defaultPhoto"
                );


            image.src =
                photo;


            image.onload =
                function(){

                    image.style.display =
                        "block";

                    defaultPhoto.style.display =
                        "none";

                };


            image.onerror =
                function(){

                    image.style.display =
                        "none";

                    defaultPhoto.style.display =
                        "block";

                };

        }


        document.getElementById(
            "loading"
        ).style.display =
            "none";

    }

    catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        const errorBox =

            );


        errorBox.style.display =
            "block";


        errorBox.textContent =
            "Unable to load customer data: " +
            error.message;

    }

}

/* =====================================================
   GRAPH
===================================================== */

const canvas =
document.getElementById(
    "speedCanvas"
);

const ctx =
canvas.getContext(
    "2d"
);


const downloadElement =
document.getElementById(
    "downloadSpeed"
);

const uploadElement =
document.getElementById(
    "uploadSpeed"
);


let downloadBase = 7.2;

let uploadBase = 1.5;

let download = 7.2;

let upload = 1.5;

let downloadHistory = [];

let uploadHistory = [];

const MAX_POINTS = 80;


/* =====================================================
   RANDOM SPEED
===================================================== */

function randomSpeed(
    base,
    percent
){

    const variation =
        base *
        percent;


    let value =
        base +
        (
            Math.random() * 2 - 1
        ) *
        variation;


    if(value < 0){

        value = 0;

    }


    return value;

}


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas(){

    const rect =
        canvas.parentElement
        .getBoundingClientRect();


    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;


    canvas.height =
        rect.height * ratio;


    canvas.style.width =
        rect.width + "px";


    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   DRAW GRAPH
===================================================== */

function drawGraph(){

    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    if(
        !width ||
        !height
    ){

        return;

    }


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if(
        downloadHistory.length < 2
    ){

        return;

    }


    const dark =
        document.body.classList.contains(
            "dark"
        );


    /* GRID */

    ctx.lineWidth = 1;

    ctx.strokeStyle =
        dark
        ? "rgba(255,255,255,.06)"
        : "rgba(0,0,0,.06)";


    for(
        let i = 1;
        i < 6;
        i++
    ){

        const y =
            (
                height / 6
            ) * i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    const max =
        Math.max(
            10,
            downloadBase * 1.6
        );


    drawSmoothLine(
        downloadHistory,
        "#e00000",
        width,
        height,
        max
    );


    drawSmoothLine(
        uploadHistory,
        "#0b9b54",
        width,
        height,
        max
    );

}


/* =====================================================
   DRAW LINE
===================================================== */

function drawSmoothLine(
    data,
    color,
    width,
    height,
    max
){

    if(
        data.length < 2
    ){

        return;

    }


    const points = [];


    data.forEach(
        function(
            value,
            index
        ){

            const x =
                (
                    index /
                    (data.length - 1)
                ) *
                width;


            const y =
                height -
                (
                    value / max
                ) *
                (
                    height - 22
                ) -
                11;


            points.push({
                x:x,
                y:y
            });

        }
    );


    /* AREA */

    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        height
    );


    ctx.lineTo(
        points[0].x,
        points[0].y
    );


    for(
        let i = 1;
        i < points.length;
        i++
    ){

        const previous =
            points[i - 1];


        const current =
            points[i];


        const midX =
            (
                previous.x +
                current.x
            ) / 2;


        ctx.quadraticCurveTo(
            previous.x,
            previous.y,
            midX,
            (
                previous.y +
                current.y
            ) / 2
        );

    }


    const last =
        points[
            points.length - 1
        ];


    ctx.lineTo(
        last.x,
        last.y
    );


    ctx.lineTo(
        last.x,
        height
    );


    ctx.closePath();


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    if(color === "#e00000"){

        gradient.addColorStop(
            0,
            "rgba(224,0,0,.13)"
        );

        gradient.addColorStop(
            1,
            "rgba(224,0,0,0)"
        );

    }

    else{

        gradient.addColorStop(
            0,
            "rgba(11,155,84,.13)"
        );

        gradient.addColorStop(
            1,
            "rgba(11,155,84,0)"
        );

    }


    ctx.fillStyle =
        gradient;


    ctx.fill();


    /* LINE */

    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for(
        let i = 1;
        i < points.length;
        i++
    ){

        const previous =
            points[i - 1];


        const current =
            points[i];


        const midX =
            (
                previous.x +
                current.x
            ) / 2;


        ctx.quadraticCurveTo(
            previous.x,
            previous.y,
            midX,
            (
                previous.y +
                current.y
            ) / 2
        );

    }


    ctx.lineTo(
        last.x,
        last.y
    );


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        3;

    ctx.lineJoin =
        "round";

    ctx.lineCap =
        "round";

    ctx.shadowBlur =
        7;

    ctx.shadowColor =
        color;

    ctx.stroke();

    ctx.shadowBlur = 0;


    /* CURRENT POINT */

    const pointIndex =
        Math.max(
            0,
            data.length - 1
        );


    const point =
        points[
            pointIndex
        ];


    ctx.beginPath();


    ctx.arc(
        point.x,
        point.y,
        9,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color === "#e00000"
        ? "rgba(224,0,0,.14)"
        : "rgba(11,155,84,.14)";


    ctx.fill();


    ctx.beginPath();


    ctx.arc(
        point.x,
        point.y,
        4,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color;


    ctx.fill();

}


/* =====================================================
   UPDATE SPEED
===================================================== */

function updateSpeed(){

    /*
    Download একটু বেশি/কম হবে
    এবং stable থাকবে না।
    */

    download =
        randomSpeed(
            downloadBase,
            .14
        );


    upload =
        randomSpeed(
            uploadBase,
            .20
        );


    downloadElement.textContent =
        download.toFixed(1);


    uploadElement.textContent =
        upload.toFixed(1);


    downloadHistory.push(
        download
    );


    uploadHistory.push(
        upload
    );


    if(
        downloadHistory.length >
        MAX_POINTS
    ){

        downloadHistory.shift();

    }


    if(
        uploadHistory.length >
        MAX_POINTS
    ){

        uploadHistory.shift();

    }


    drawGraph();

}

   INITIAL GRAPH
===================================================== */

for(

    i < 30;
    i++
){

    downloadHistory.push(
        randomSpeed(
            downloadBase,
            .14
        )
    );


    uploadHistory.push(
        randomSpeed(
            uploadBase,
            .20
        )
    );

}


resizeCanvas();


/* =====================================================
   START
===================================================== */

setInterval(
    updateSpeed,
    350
);

===================================================== */

loadCustomerData();
