<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Customer Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{

    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#202020;
    --muted:#777;
    --border:#dddddd;
    --green:#08783d;

}

body.dark{

    --bg:#050505;
    --card:#111111;
    --text:#ffffff;
    --muted:#aaaaaa;
    --border:#292929;
    --green:#19a866;

}

body{

    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    transition:.3s;

}


/* =====================================================
   THEME
===================================================== */

.theme-button{

    position:fixed;

    top:7px;

    right:7px;

    width:28px;

    height:28px;

    border:1px solid var(--border);

    border-radius:50%;

    background:var(--card);

    color:var(--text);

    cursor:pointer;

    z-index:9999;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:65px;

    background:var(--card);

    border-bottom:1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    position:sticky;

    top:0;

    z-index:100;

}

.title{

    color:var(--green);

    font-size:20px;

    font-weight:bold;

}

.logout{

    border:0;

    background:var(--green);

    color:white;

    padding:10px 17px;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:22px 16px 40px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:50px 20px;

    color:var(--muted);

    font-size:14px;

}

.loader{

    width:35px;

    height:35px;

    border:4px solid var(--border);

    border-top-color:var(--green);

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin:0 auto 15px;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    display:none;

    background:#fff0f0;

    color:#d00000;

    border:1px solid #ffcccc;

    border-radius:12px;

    padding:15px;

    margin-bottom:15px;

    font-size:13px;

    text-align:center;

}


/* =====================================================
   TOP
===================================================== */

.top{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:12px;

}

.box{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

}

.label{

    color:var(--muted);

    font-size:11px;

    font-weight:bold;

    margin-bottom:7px;

}

.value{

    color:var(--text);

    font-size:16px;

    font-weight:bold;

    word-break:break-word;

}


/* =====================================================
   MAC
===================================================== */

.mac-box{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:18px;

}

.mac-title{

    color:var(--muted);

    font-size:11px;

    font-weight:bold;

    margin-bottom:7px;

}

.mac-value{

    color:var(--text);

    font-size:16px;

    font-weight:bold;

    word-break:break-all;

}


/* =====================================================
   PHOTO
===================================================== */

.photo-box{

    display:flex;

    justify-content:center;

    margin:5px 0 22px;

}

.photo{

    width:190px;

    height:190px;

    border-radius:50%;

    overflow:hidden;

    background:#dff0e8;

    border:6px solid var(--card);

    box-shadow:
        0 7px 30px rgba(0,0,0,.18);

}

.photo svg{

    width:100%;

    height:100%;

    display:block;

}


/* =====================================================
   SPEED
===================================================== */

.speed-box{

    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--bg)
        );

    border:1px solid var(--border);

    border-radius:18px;

    padding:17px;

    margin-bottom:14px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.06);

}

.speed-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    cursor:pointer;

    margin-bottom:15px;

}

.speed-title{

    color:var(--muted);

    font-size:14px;

    font-weight:bold;

}

.speed-arrow{

    display:inline-block;

    margin-right:5px;

    font-size:10px;

    transition:.3s;

}

.speed-box.minimized
.speed-arrow{

    transform:rotate(-90deg);

}

.speed-live{

    display:flex;

    align-items:center;

    gap:5px;

    font-size:10px;

    font-weight:bold;

    color:#08783d;

    background:#e8f7ef;

    padding:6px 9px;

    border-radius:20px;

}

.live-dot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:#0aa854;

    animation:pulse 1s infinite;

}

@keyframes pulse{

    50%{
        opacity:.3;
        transform:scale(.7);
    }

}

.speed-content{

    max-height:600px;

    overflow:hidden;

    opacity:1;

    transition:.4s;

}

.speed-box.minimized
.speed-content{

    max-height:0;

    opacity:0;

}


/* =====================================================
   SPEED VALUES
===================================================== */

.speed-values{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:15px;

}

.speed-value-box{

    border:1px solid var(--border);

    border-radius:13px;

    padding:13px;

    background:var(--bg);

}

.speed-value-title{

    font-size:10px;

    font-weight:bold;

    margin-bottom:5px;

}

.download-title{

    color:#e00000;

}

.upload-title{

    color:#0b9b54;

}

.speed-number-row{

    display:flex;

    align-items:baseline;

    gap:5px;

}

.speed-value{

    font-size:25px;

    font-weight:bold;

}

.speed-unit{

    color:var(--muted);

    font-size:10px;

    font-weight:bold;

}


/* =====================================================
   LEGEND
===================================================== */

.graph-legend{

    display:flex;

    justify-content:center;

    gap:28px;

    margin-bottom:9px;

}

.legend{

    display:flex;

    align-items:center;

    gap:6px;

    font-size:11px;

    font-weight:bold;

}

.legend-line{

    width:24px;

    height:3px;

    border-radius:20px;

}

.download-line{

    background:#e00000;

}

.upload-line{

    background:#0b9b54;

}


/* =====================================================
   GRAPH
===================================================== */

.graph-container{

    width:100%;

    height:200px;

    border:1px solid var(--border);

    border-radius:13px;

    overflow:hidden;

}

#speedCanvas{

    width:100%;

    height:100%;

    display:block;

}

.speed-note{

    text-align:center;

    color:var(--muted);

    font-size:10px;

    margin-top:8px;

}


/* =====================================================
   INFORMATION
===================================================== */

.info,
.billing,
.bill,
.address,
.connection{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:12px;

}

.info-title{

    color:var(--muted);

    font-size:11px;

    font-weight:bold;

    margin-bottom:7px;

}

.info-value{

    color:var(--text);

    font-size:17px;

    font-weight:bold;

    line-height:1.5;

    word-break:break-word;

}

.bill-value{

    color:var(--green);

    font-size:23px;

    font-weight:bold;

}


/* =====================================================
   STATUS
===================================================== */

.online{

    display:inline-flex;

    align-items:center;

    gap:7px;

    background:#e8f7ef;

    color:#08783d;

    padding:7px 11px;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;

}

.online-dot{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#0aa854;

    box-shadow:0 0 7px #0aa854;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    .header{

        height:60px;

        padding:0 14px;

    }

    .title{

        font-size:18px;

    }

    .container{

        padding:18px 13px 30px;

    }

    .photo{

        width:180px;

        height:180px;

    }

    .speed-value{

        font-size:21px;

    }

    .graph-container{

        height:185px;

    }

}

</style>

</head>

<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwEda0meR5ZzPbUZqH_5dpbIQWt1Z7fArv6adM5yRMGMDYwOkkZn-O1bZ0v4xHFTuGmwA/exec";


/* =====================================================
   LOGIN CHECK
===================================================== */

const loggedIn =
    localStorage.getItem("loggedIn") === "true" ||
    sessionStorage.getItem("loggedIn") === "true";


if(!loggedIn){

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   GET USERNAME
===================================================== */

const username =
    localStorage.getItem("username") ||
    sessionStorage.getItem("username");


if(!username){

    localStorage.clear();

    sessionStorage.clear();

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );

const dashboard =
    document.getElementById(
        "dashboard"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


/* =====================================================
   LOAD CUSTOMER
===================================================== */

async function loadCustomer(){

    try{

        const url =
            API_URL +
            "?action=customer" +
            "&username=" +
            encodeURIComponent(
                username
            );


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "CUSTOMER DATA:",
            data
        );


        if(
            data.success !== true
        ){

            throw new Error(
                data.message ||
                "Customer data not found."
            );

        }


        showCustomer(
            data
        );

    }

    catch(error){

        console.error(
            error
        );


        loading.style.display =
            "none";


        errorBox.style.display =
            "block";


        errorBox.textContent =
            error.message ||
            "Unable to load customer data.";

    }

}


/* =====================================================
   SHOW CUSTOMER
===================================================== */

function showCustomer(
    data
){

    loading.style.display =
        "none";


    dashboard.style.display =
        "block";


    /*
    -----------------------------------------------------
    USERNAME
    -----------------------------------------------------
    */

    document.getElementById(
        "username"
    ).textContent =
        data.username || "-";


    /*
    -----------------------------------------------------
    PASSWORD
    -----------------------------------------------------
    */

    document.getElementById(
        "password"
    ).textContent =
        data.password || "-";


    /*
    -----------------------------------------------------
    MAC
    -----------------------------------------------------
    */

    document.getElementById(
        "mac"
    ).textContent =
        data.mac || "-";


    /*
    -----------------------------------------------------
    NAME
    -----------------------------------------------------
    */

    document.getElementById(
        "name"
    ).textContent =
        data.name || "-";


    /*
    -----------------------------------------------------
    DOWNLOAD
    -----------------------------------------------------
    */

    const download =
        parseFloat(
            data.download
        ) || 0;


    /*
    -----------------------------------------------------
    UPLOAD
    -----------------------------------------------------
    */

    const upload =
        parseFloat(
            data.upload
        ) || 0;


    document.getElementById(
        "downloadSpeed"
    ).textContent =
        download;


    document.getElementById(
        "uploadSpeed"
    ).textContent =
        upload;


    /*
    -----------------------------------------------------
    BILLING DATE
    -----------------------------------------------------
    */

    document.getElementById(
        "billingDate"
    ).textContent =
        data.billingDate || "-";


    /*
    -----------------------------------------------------
    BILL
    -----------------------------------------------------
    */

    document.getElementById(
        "bill"
    ).textContent =
        data.bill
            ? data.bill + " tk"
            : "-";


    /*
    -----------------------------------------------------
    ADDRESS
    -----------------------------------------------------
    */

    document.getElementById(
        "address"
    ).textContent =
        data.address || "-";


    /*
    -----------------------------------------------------
    START GRAPH
    -----------------------------------------------------
    */

    startGraph(
        download,
        upload
    );

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem(
        "loggedIn"
    );

    localStorage.removeItem(
        "username"
    );


    sessionStorage.removeItem(
        "loggedIn"
    );

    sessionStorage.removeItem(
        "username"
    );


    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   THEME
===================================================== */

const themeButton =
    document.getElementById(
        "themeButton"
    );


function loadTheme(){

    const theme =
        localStorage.getItem(
            "customerTheme"
        );


    if(theme === "dark"){

        document.body.classList.add(
            "dark"
        );

        themeButton.textContent =
            "☀";

    }

}


function toggleTheme(){

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "customerTheme",
        dark
            ? "dark"
            : "light"
    );


    themeButton.textContent =
        dark
            ? "☀"
            : "☾";


    drawGraph();

}


loadTheme();


/* =====================================================
   SPEED BOX
===================================================== */

const speedBox =
    document.getElementById(
        "speedBox"
    );


function toggleSpeed(){

    speedBox.classList.toggle(
        "minimized"
    );

}


/* =====================================================
   GRAPH VARIABLES
===================================================== */

let downloadValue = 0;

let uploadValue = 0;

let downloadHistory = [];

let uploadHistory = [];

const MAX_POINTS = 80;

let graphTimer = null;


/* =====================================================
   START GRAPH
===================================================== */

function startGraph(
    download,
    upload
){

    downloadValue =
        download;


    uploadValue =
        upload;


    downloadHistory = [];

    uploadHistory = [];


    /*
    Initial graph
    */

    for(
        let i = 0;
        i < 25;
        i++
    ){

        downloadHistory.push(
            download *
            (
                .75 +
                Math.random() * .25
            )
        );


        uploadHistory.push(
            upload *
            (
                .75 +
                Math.random() * .25
            )
        );

    }


    resizeCanvas();


    if(graphTimer){

        clearInterval(
            graphTimer
        );

    }


    graphTimer =
        setInterval(
            updateGraph,
            300
        );

}


/* =====================================================
   GRAPH UPDATE
===================================================== */

function updateGraph(){

    /*
    Slight fake live movement around
    the Sheet value.

    Sheet-এর মূল speed value পরিবর্তন হয় না।
    */

    const downloadVariation =
        Math.max(
            0,
            downloadValue *
            (
                1 +
                (
                    Math.random() * .08 -
                    .04
                )
            )
        );


    const uploadVariation =
        Math.max(
            0,
            uploadValue *
            (
                1 +
                (
                    Math.random() * .08 -
                    .04
                )
            )
        );


    downloadHistory.push(
        downloadVariation
    );


    uploadHistory.push(
        uploadVariation
    );


    if(
        downloadHistory.length >
        MAX_POINTS
    ){

        downloadHistory.shift();

    }


    if(
        uploadHistory.length >
        MAX_POINTS
    ){

        uploadHistory.shift();

    }


    drawGraph();

}


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "speedCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


function resizeCanvas(){

    const rect =
        canvas.parentElement
        .getBoundingClientRect();


    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;


    canvas.height =
        rect.height * ratio;


    canvas.style.width =
        rect.width + "px";


    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   DRAW GRAPH
===================================================== */

function drawGraph(){

    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    if(
        !width ||
        !height
    ){

        return;

    }


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if(
        downloadHistory.length < 2
    ){

        return;

    }


    const dark =
        document.body.classList.contains(
            "dark"
        );


    /*
    GRID
    */

    ctx.lineWidth = 1;

    ctx.strokeStyle =
        dark
            ? "rgba(255,255,255,.06)"
            : "rgba(0,0,0,.06)";


    for(
        let i = 1;
        i < 6;
        i++
    ){

        const y =
            (
                height / 6
            ) * i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /*
    Dynamic max
    */

    const max =
        Math.max(
            downloadValue,
            uploadValue,
            1
        ) * 1.25;


    drawLine(
        downloadHistory,
        "#e00000",
        width,
        height,
        max
    );


    drawLine(
        uploadHistory,
        "#0b9b54",
        width,
        height,
        max
    );

}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(
    data,
    color,
    width,
    height,
    max
){

    if(
        data.length < 2
    ){

        return;

    }


    const points = [];


    data.forEach(
        function(
            value,
            index
        ){

            const x =
                (
                    index /
                    (
                        data.length - 1
                    )
                ) *
                width;


            const y =
                height -
                (
                    value / max
                ) *
                (
                    height - 22
                ) -
                11;


            points.push({
                x:x,
                y:y
            });

        }
    );


    /*
    AREA
    */

    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        height
    );


    ctx.lineTo(
        points[0].x,
        points[0].y
    );


    for(
        let i = 1;
        i < points.length;
        i++
    ){

        const previous =
            points[i - 1];


        const current =
            points[i];


        const midX =
            (
                previous.x +
                current.x
            ) / 2;


        ctx.quadraticCurveTo(
            previous.x,
            previous.y,
            midX,
            (
                previous.y +
                current.y
            ) / 2
        );

    }


    const last =
        points[
            points.length - 1
        ];


    ctx.lineTo(
        last.x,
        last.y
    );


    ctx.lineTo(
        last.x,
        height
    );


    ctx.closePath();


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    if(color === "#e00000"){

        gradient.addColorStop(
            0,
            "rgba(224,0,0,.13)"
        );

        gradient.addColorStop(
            1,
            "rgba(224,0,0,0)"
        );

    }
    else{

        gradient.addColorStop(
            0,
            "rgba(11,155,84,.13)"
        );

        gradient.addColorStop(
            1,
            "rgba(11,155,84,0)"
        );

    }


    ctx.fillStyle =
        gradient;

    ctx.fill();


    /*
    LINE
    */

    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for(
        let i = 1;
        i < points.length;
        i++
    ){

        const previous =
            points[i - 1];


        const current =
            points[i];


        const midX =
            (
                previous.x +
                current.x
            ) / 2;


        ctx.quadraticCurveTo(
            previous.x,
            previous.y,
            midX,
            (
                previous.y +
                current.y
            ) / 2
        );

    }


    ctx.lineTo(
        last.x,
        last.y
    );


    ctx.strokeStyle =
        color;

    ctx.lineWidth = 3;

    ctx.lineJoin =
        "round";

    ctx.lineCap =
        "round";

    ctx.shadowBlur = 7;

    ctx.shadowColor =
        color;

    ctx.stroke();

    ctx.shadowBlur = 0;


    /*
    CURRENT POINT
    */

    const point =
        points[
            Math.max(
                0,
                points.length - 3
            )
        ];


    ctx.beginPath();


    ctx.arc(
        point.x,
        point.y,
        9,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color === "#e00000"
            ? "rgba(224,0,0,.14)"
            : "rgba(11,155,84,.14)";


    ctx.fill();


    ctx.beginPath();


    ctx.arc(
        point.x,
        point.y,
        4,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color;


    ctx.fill();

}
