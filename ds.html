<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#222;
    --muted:#777;
    --border:#dddddd;
    --green:#0b5d3b;
}

body.dark{
    --bg:#000000;
    --card:#111111;
    --text:#ffffff;
    --muted:#aaaaaa;
    --border:#292929;
    --green:#19a866;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}

/* THEME */

.theme-button{
    position:fixed;
    top:5px;
    right:5px;
    width:25px;
    height:25px;
    border:1px solid var(--border);
    border-radius:50%;
    background:var(--card);
    color:var(--text);
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:9999;
}

/* HEADER */

.header{
    height:65px;
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
}

.title{
    font-size:20px;
    font-weight:bold;
    color:var(--green);
}

.logout{
    border:0;
    background:var(--green);
    color:white;
    padding:10px 17px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:22px 16px 40px;
}

/* TOP */

.top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
}

.box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
}

.label{
    font-size:12px;
    font-weight:bold;
    color:var(--muted);
    margin-bottom:7px;
}

.value{
    font-size:16px;
    font-weight:bold;
    color:var(--text);
    word-break:break-word;
}

/* MAC */

.mac-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-bottom:18px;
}

.mac-title{
    font-size:12px;
    color:var(--muted);
    font-weight:bold;
    margin-bottom:7px;
}

.mac-value{
    font-size:17px;
    font-weight:bold;
    color:var(--text);
    word-break:break-all;
}

/* PHOTO */

.photo-box{
    width:100%;
    display:flex;
    justify-content:center;
    margin:5px 0 22px;
}

.photo{
    width:220px;
    height:220px;
    border-radius:50%;
    overflow:hidden;
    background:#dff0e8;
    border:6px solid var(--card);
    box-shadow:0 7px 30px rgba(0,0,0,.18);
}

.photo svg{
    width:100%;
    height:100%;
    display:block;
}

/* SPEED */

.speed-box{
    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--bg)
        );

    border:1px solid var(--border);
    border-radius:18px;
    padding:17px;
    margin-bottom:14px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.06);
}

.speed-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    user-select:none;
    margin-bottom:15px;
}

.speed-title{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    font-weight:bold;
    color:var(--muted);
}

.speed-arrow{
    font-size:10px;
    transition:.3s;
    color:var(--muted);
}

.speed-live{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:10px;
    font-weight:bold;
    color:#08783d;
    background:#e8f7ef;
    padding:6px 9px;
    border-radius:20px;
}

.live-dot{
    width:6px;
    height:6px;
    background:#0aa854;
    border-radius:50%;
    animation:livePulse 1s infinite;
}

@keyframes livePulse{
    0%{
        opacity:.4;
        transform:scale(.8);
    }
    50%{
        opacity:1;
        transform:scale(1.2);
    }
    100%{
        opacity:.4;
        transform:scale(.8);
    }
}

.speed-content{
    max-height:600px;
    overflow:hidden;
    opacity:1;
    transition:max-height .4s ease,opacity .25s ease;
}

.speed-box.minimized{
    padding-bottom:15px;
}

.speed-box.minimized .speed-header{
    margin-bottom:0;
}

.speed-box.minimized .speed-content{
    max-height:0;
    opacity:0;
    pointer-events:none;
}

.speed-box.minimized .speed-arrow{
    transform:rotate(-90deg);
}

/* SPEED VALUES */

.speed-values{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.speed-value-box{
    border:1px solid var(--border);
    border-radius:13px;
    padding:13px;
    background:var(--bg);
    position:relative;
    overflow:hidden;
}

.speed-value-box::after{
    content:"";
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    right:-25px;
    bottom:-25px;
    opacity:.08;
}

.download-card::after{
    background:#e00000;
}

.upload-card::after{
    background:#0b9b54;
}

.speed-value-title{
    font-size:10px;
    font-weight:bold;
    margin-bottom:5px;
    letter-spacing:.5px;
}

.download-title{
    color:#e00000;
}

.upload-title{
    color:#0b9b54;
}

.speed-number-row{
    display:flex;
    align-items:baseline;
    gap:5px;
}

.speed-value{
    font-size:25px;
    font-weight:bold;
    color:var(--text);
}

.speed-unit{
    font-size:10px;
    color:var(--muted);
    font-weight:bold;
}

/* LEGEND */

.graph-legend{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:28px;
    margin-bottom:9px;
}

.legend{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:bold;
    color:var(--text);
}

.legend-line{
    width:24px;
    height:3px;
    border-radius:20px;
}

.download-line{
    background:#e00000;
    box-shadow:0 0 7px rgba(224,0,0,.4);
}

.upload-line{
    background:#0b9b54;
    box-shadow:0 0 7px rgba(11,155,84,.4);
}

/* GRAPH */

.graph-container{
    width:100%;
    height:200px;
    position:relative;
    border-radius:13px;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            rgba(128,128,128,.02),
            rgba(128,128,128,.08)
        );
    border:1px solid var(--border);
}

#speedCanvas{
    width:100%;
    height:100%;
    display:block;
}

.speed-note{
    text-align:center;
    font-size:10px;
    color:var(--muted);
    margin-top:8px;
}

/* INFO */

.info,
.billing,
.bill,
.address,
.connection{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.info-title{
    font-size:12px;
    color:var(--muted);
    font-weight:bold;
    margin-bottom:7px;
}

.info-value{
    font-size:17px;
    font-weight:bold;
    line-height:1.4;
    color:var(--text);
    word-break:break-word;
}

.bill-value{
    font-size:22px;
    font-weight:bold;
    color:var(--green);
}

/* ONLINE */

.online{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    background:#e8f7ef;
    color:#08783d;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
}

.online-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#0aa854;
    box-shadow:0 0 7px #0aa854;
    animation:onlinePulse 1.3s infinite;
}

@keyframes onlinePulse{
    0%,100%{
        opacity:.6;
    }
    50%{
        opacity:1;
    }
}

/* LOADING */

.loading{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
}

.loading-box{
    background:white;
    color:#222;
    padding:20px 28px;
    border-radius:14px;
    font-weight:bold;
    font-size:14px;
}

body.dark .loading-box{
    background:#151515;
    color:white;
}

/* MOBILE */

@media(max-width:500px){

    .header{
        height:60px;
        padding:0 14px;
    }

    .title{
        font-size:18px;
    }

    .logout{
        padding:9px 13px;
    }

    .container{
        padding:18px 13px 30px;
    }

    .photo{
        width:200px;
        height:200px;
    }

    .value{
        font-size:14px;
    }

    .mac-value{
        font-size:15px;
    }

    .info-value{
        font-size:15px;
    }

    .speed-value{
        font-size:21px;
    }

    .graph-container{
        height:185px;
    }

}

</style>

</head>

<script>

/* ============================================================
   API URL
============================================================ */

const API_URL =
"https://script.google.com/macros/s/AKfycbwEda0meR5ZzPbUZqH_5dpbIQWt1Z7fArv6adM5yRMGMDYwOkkZn-O1bZ0v4xHFTuGmwA/exec";


/* ============================================================
   LOGIN CHECK
============================================================ */

const loggedIn =
localStorage.getItem("loggedIn") === "true" ||
sessionStorage.getItem("loggedIn") === "true";


if(!loggedIn){

    window.location.replace(
        "index.html"
    );

}


/* ============================================================
   GET USERNAME
============================================================ */

const username =
sessionStorage.getItem("username") ||
localStorage.getItem("username");


if(!username){

    localStorage.removeItem("loggedIn");
    sessionStorage.removeItem("loggedIn");

    window.location.replace(
        "index.html"
    );

}


/* ============================================================
   LOAD CUSTOMER DATA
============================================================ */

async function loadCustomerData(){

    try{

        const url =
            API_URL +
            "?action=customer" +
            "&username=" +
            encodeURIComponent(username) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const result =
            await response.json();


        console.log(
            "CUSTOMER DATA:",
            result
        );


        if(
            result.success !== true
        ){

            alert(
                result.message ||
                "Customer data not found."
            );

            logout();

            return;

        }


        const data =
            result.data ||
            result.customer ||
            result;


        /* USERNAME */

        document.getElementById(
            "username"
        ).textContent =
            data.username ||
            username;


        /* PASSWORD */

        document.getElementById(
            "password"
        ).textContent =
            data.password ||
            "••••••";


        /* MAC */

        document.getElementById(
            "mac"
        ).textContent =
            data.mac ||
            "Not available";


        /* NAME */

        document.getElementById(
            "name"
        ).textContent =
            data.name ||
            "Not available";


        /* BILLING DATE */

        document.getElementById(
            "billingDate"
        ).textContent =
            data.billingDate ||
            "Not available";


        /* BILL */

        document.getElementById(
            "bill"
        ).textContent =
            data.bill
            ? data.bill + " tk"
            : "Not available";


        /* ADDRESS */

        document.getElementById(
            "address"
        ).textContent =
            data.address ||
            "Not available";


        /* STATUS */

        setStatus(
            data.status
        );


        /* SPEED */

        let d =
            parseFloat(
                data.download
            );

        let u =
            parseFloat(
                data.upload
            );


        if(isNaN(d)){
            d = 7;
        }

        if(isNaN(u)){
            u = 1.5;
        }


        baseDownload = d;
        baseUpload = u;


        download =
            baseDownload;

        upload =
            baseUpload;


        downloadElement.textContent =
            download.toFixed(1);

        uploadElement.textContent =
            upload.toFixed(1);


        createHistory();


        resizeCanvas();


        document.getElementById(
            "loading"
        ).style.display =
            "none";

    }

    catch(error){

        console.error(
            error
        );


        alert(
            "Unable to load customer data."
        );

        document.getElementById(
            "loading"
        ).style.display =
            "none";

    }

}


/* ============================================================
   STATUS
============================================================ */

function setStatus(status){

    const element =
        document.getElementById(
            "status"
        );


    const value =
        String(
            status || "Online"
        ).toLowerCase();


    if(
        value === "offline" ||
        value === "blocked" ||
        value === "inactive"
    ){

        element.innerHTML =
            '<span class="online-dot"></span> ' +
            (
                status ||
                "Offline"
            );

        element.style.background =
            "#ffe9e9";

        element.style.color =
            "#c40000";

    }

    else{

        element.innerHTML =
            '<span class="online-dot"></span> ' +
            (
                status ||
                "Online"
            );

    }

}


/* ============================================================
   LOGOUT
============================================================ */

function logout(){

    localStorage.removeItem(
        "loggedIn"
    );

    localStorage.removeItem(
        "username"
    );

    sessionStorage.removeItem(
        "loggedIn"
    );

    sessionStorage.removeItem(
        "username"
    );


    window.location.replace(
        "index.html"
    );

}


/* ============================================================
   THEME
============================================================ */

const themeButton =
document.getElementById(
    "themeButton"
);


function loadTheme(){

    const theme =
        localStorage.getItem(
            "customerTheme"
        );


    if(theme === "dark"){

        document.body.classList.add(
            "dark"
        );

        themeButton.textContent =
            "☀";

    }

}


function toggleTheme(){

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "customerTheme",
        dark
        ? "dark"
        : "light"
    );


    themeButton.textContent =
        dark
        ? "☀"
        : "☾";


    drawGraph();

}


loadTheme();


/* ============================================================
   SPEED BOX
============================================================ */

const speedBox =
document.getElementById(
    "speedBox"
);


const savedSpeedState =
localStorage.getItem(
    "speedBoxMinimized"
);


if(savedSpeedState === "true"){

    speedBox.classList.add(
        "minimized"
    );

}


function toggleSpeed(){

    speedBox.classList.toggle(
        "minimized"
    );


    localStorage.setItem(
        "speedBoxMinimized",
        speedBox.classList.contains(
            "minimized"
        )
    );

}


/* ============================================================
   GRAPH
============================================================ */

const canvas =
document.getElementById(
    "speedCanvas"
);

const ctx =
canvas.getContext(
    "2d"
);


const downloadElement =
document.getElementById(
    "downloadSpeed"
);

const uploadElement =
document.getElementById(
    "uploadSpeed"
);


let baseDownload = 7;

let baseUpload = 1.5;

let download = 7;

let upload = 1.5;

let downloadHistory = [];

let uploadHistory = [];

const MAX_POINTS = 80;


/* ============================================================
   CREATE HISTORY
============================================================ */

function createHistory(){

    downloadHistory = [];
    uploadHistory = [];


    for(
        let i = 0;
        i < 80;
        i++
    ){

        downloadHistory.push(
            getNaturalSpeed(
                baseDownload,
                0.20
            )
        );


        uploadHistory.push(
            getNaturalSpeed(
                baseUpload,
                0.15
            )
        );

    }

}


/* ============================================================
   NATURAL SPEED
============================================================ */

function getNaturalSpeed(
    base,
    variation
){

    let value =
        base +
        (
            Math.random() *
            2 -
            1
        ) *
        (
            base *
            variation
        );


    /* মাঝে মাঝে একটু বেশি */

    if(
        Math.random() <
        0.10
    ){

        value +=
            base *
            (
                0.10 +
                Math.random() *
                0.15
            );

    }


    /* মাঝে মাঝে একটু কম */

    if(
        Math.random() <
        0.08
    ){

        value -=
            base *
            (
                0.08 +
                Math.random() *
                0.12
            );

    }


    return Math.max(
        0.1,
        value
    );

}


/* ============================================================
   RESIZE
============================================================ */

function resizeCanvas(){

    const rect =
        canvas.parentElement
        .getBoundingClientRect();


    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;


    canvas.height =
        rect.height * ratio;


    canvas.style.width =
        rect.width + "px";


    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ============================================================
   DRAW GRAPH
============================================================ */

function drawGraph(){

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    if(
        !width ||
        !height ||
        downloadHistory.length < 2
    ){

        return;

    }


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    /* GRID */

    ctx.lineWidth = 1;

    ctx.strokeStyle =
        dark
        ? "rgba(255,255,255,.06)"
        : "rgba(0,0,0,.06)";


    for(
        let i = 1;
        i < 6;
        i++
    ){

        const y =
            (
                height / 6
            ) * i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /*
    Dynamic maximum.
    */

    const maxValue =
        Math.max(
            baseDownload * 1.5,
            10
        );


    drawSmoothLine(
        downloadHistory,
        "#e00000",
        width,
        height,
        maxValue
    );


    drawSmoothLine(
        uploadHistory,
        "#0b9b54",
        width,
        height,
        maxValue
    );

}


/* ============================================================
   DRAW SMOOTH LINE
============================================================ */

function drawSmoothLine(
    data,
    color,
    width,
    height,
    max
){

    if(
        data.length < 2
    ){

        return;

    }


    const points = [];


    data.forEach(
        function(
            value,
            index
        ){

            const x =
                (
                    index /
                    (
                        data.length - 1
                    )
                ) *
                width;


            const y =
                height -
                (
                    value /
                    max
                ) *
                (
                    height - 22
                ) -
                11;


            points.push({
                x:x,
                y:y
            });

        }
    );


    /* AREA */

    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        height
    );


    ctx.lineTo(
        points[0].x,
        points[0].y
    );


    for(
        let i = 1;
        i < points.length;
        i++
    ){

        const previous =
            points[i - 1];

        const current =
            points[i];


        const midX =
            (
                previous.x +
                current.x
            ) / 2;


        ctx.quadraticCurveTo(
            previous.x,
            previous.y,
            midX,
            (
                previous.y +
                current.y
            ) / 2
        );

    }


    const last =
        points[
            points.length - 1
        ];


    ctx.lineTo(
        last.x,
        last.y
    );

    ctx.lineTo(
        last.x,
        height
    );

    ctx.closePath();


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


    if(
        color === "#e00000"
    ){

        gradient.addColorStop(
            0,
            "rgba(224,0,0,.13)"
        );

        gradient.addColorStop(
            1,
            "rgba(224,0,0,0)"
        );

    }

    else{

        gradient.addColorStop(
            0,
            "rgba(11,155,84,.13)"
        );

        gradient.addColorStop(
            1,
            "rgba(11,155,84,0)"
        );

    }


    ctx.fillStyle =
        gradient;

    ctx.fill();


    /* LINE */

    ctx.beginPath();


    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for(
        let i = 1;
        i < points.length;
        i++
    ){

        const previous =
            points[i - 1];

        const current =
            points[i];


        const midX =
            (
                previous.x +
                current.x
            ) / 2;


        ctx.quadraticCurveTo(
            previous.x,
            previous.y,
            midX,
            (
                previous.y +
                current.y
            ) / 2
        );

    }


    ctx.lineTo(
        last.x,
        last.y
    );


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        3;

    ctx.lineJoin =
        "round";

    ctx.lineCap =
        "round";

    ctx.shadowBlur =
        7;

    ctx.shadowColor =
        color;

    ctx.stroke();

    ctx.shadowBlur =
        0;


    /* CURRENT POINT */

    const point =
        points[
            points.length - 1
        ];


    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        9,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color === "#e00000"
        ? "rgba(224,0,0,.14)"
        : "rgba(11,155,84,.14)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        5,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffffff";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        3.5,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color;

    ctx.fill();

}


/* ============================================================
   UPDATE SPEED
============================================================ */

function updateSpeed(){

    /*
    Base speed থেকে natural movement.
    */

    const targetDownload =
        getNaturalSpeed(
            baseDownload,
            0.18
        );


    const targetUpload =
        getNaturalSpeed(
            baseUpload,
            0.18
        );


    /*
    Smooth movement
    */

    download +=
        (
            targetDownload -
            download
        ) *
        0.18;


    upload +=
        (
            targetUpload -
            upload
        ) *
        0.18;


    downloadElement.textContent =
        download.toFixed(1);


    uploadElement.textContent =
        upload.toFixed(1);


    downloadHistory.push(
        download
    );


    uploadHistory.push(
        upload
    );


    if(
        downloadHistory.length >
        MAX_POINTS
    ){

        downloadHistory.shift();

    }


    if(
        uploadHistory.length >
        MAX_POINTS
    ){

        uploadHistory.shift();

    }


    drawGraph();

}


/* ============================================================
   START
============================================================ */

loadCustomerData();


/*
Initial graph-এর জন্য fallback history
*/

createHistory();


resizeCanvas();


/*
প্রতি 500ms-এ speed পরিবর্তন হবে।
*/

setInterval(
    updateSpeed,
    500
);

</script>
