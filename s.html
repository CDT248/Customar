<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Internet Speed Test</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f8;
    color:#222;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:18px;
}

.card{
    width:100%;
    max-width:480px;

    background:#fff;

    border-radius:20px;

    padding:22px;

    box-shadow:
        0 10px 40px rgba(0,0,0,.12);
}


/* =========================
   TITLE
========================= */

.title{
    text-align:center;

    font-size:24px;

    font-weight:bold;

    color:#0b5d3b;

    margin-bottom:5px;
}

.subtitle{
    text-align:center;

    color:#777;

    font-size:12px;

    margin-bottom:22px;
}


/* =========================
   SPEED
========================= */

.speed-circle{
    width:190px;
    height:190px;

    border-radius:50%;

    margin:0 auto 20px;

    border:8px solid #e6eee9;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    position:relative;
}

.speed-number{
    font-size:40px;

    font-weight:bold;

    color:#0b5d3b;
}

.speed-unit{
    font-size:13px;

    color:#777;

    font-weight:bold;
}

.status{
    font-size:11px;

    color:#777;

    margin-top:7px;
}


/* =========================
   DOWNLOAD UPLOAD
========================= */

.results{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:18px;
}

.result{
    background:#f8faf9;

    border:1px solid #e1e6e3;

    border-radius:12px;

    padding:14px;
}

.result-title{
    font-size:11px;

    font-weight:bold;

    margin-bottom:6px;
}

.download-title{
    color:#e00000;
}

.upload-title{
    color:#0b9b54;
}

.result-number{
    font-size:23px;

    font-weight:bold;
}

.result-unit{
    font-size:10px;

    color:#777;

    font-weight:bold;
}


/* =========================
   GRAPH HEADER
========================= */

.graph-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:9px;
}

.graph-title{
    font-size:13px;

    font-weight:bold;

    color:#555;
}

.legend{
    display:flex;

    gap:13px;

    font-size:10px;

    font-weight:bold;
}

.legend-item{
    display:flex;

    align-items:center;

    gap:4px;
}

.legend-dot{
    width:18px;

    height:3px;

    border-radius:5px;
}

.red{
    background:#e00000;
}

.green{
    background:#0b9b54;
}


/* =========================
   GRAPH
========================= */

.graph-box{
    width:100%;

    height:210px;

    background:#f8faf9;

    border-radius:12px;

    overflow:hidden;

    position:relative;

    border:1px solid #e5e9e6;
}

#speedGraph{
    width:100%;
    height:100%;

    display:block;
}


/* =========================
   BUTTONS
========================= */

.buttons{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:18px;
}

button{
    border:0;

    padding:14px;

    border-radius:10px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;
}

.start{
    background:#0b5d3b;
}

.stop{
    background:#c62828;
}

button:disabled{
    opacity:.45;

    cursor:not-allowed;
}


/* =========================
   NOTE
========================= */

.note{
    text-align:center;

    font-size:10px;

    color:#999;

    line-height:1.5;

    margin-top:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{
        padding:10px;
    }

    .card{
        padding:18px;
    }

    .speed-circle{
        width:170px;
        height:170px;
    }

    .speed-number{
        font-size:35px;
    }

    .graph-box{
        height:190px;
    }

}

</style>

</head>


<body>


<div class="card">


    <!-- TITLE -->

    <div class="title">
        Internet Speed Test
    </div>

    <div class="subtitle">
        Live Download & Upload Monitor
    </div>


    <!-- MAIN SPEED -->

    <div class="speed-circle">

        <div
            id="mainSpeed"
            class="speed-number">
            0
        </div>

        <div
            id="mainUnit"
            class="speed-unit">
            Mbps
        </div>

        <div
            id="status"
            class="status">
            Ready
        </div>

    </div>


    <!-- DOWNLOAD / UPLOAD -->

    <div class="results">


        <div class="result">

            <div class="result-title download-title">
                🔴 DOWNLOAD
            </div>

            <span
                id="download"
                class="result-number">
                0
            </span>

            <span
                id="downloadUnit"
                class="result-unit">
                Mbps
            </span>

        </div>


        <div class="result">

            <div class="result-title upload-title">
                🟢 UPLOAD
            </div>

            <span
                id="upload"
                class="result-number">
                0
            </span>

            <span
                id="uploadUnit"
                class="result-unit">
                Mbps
            </span>

        </div>

    </div>


    <!-- GRAPH HEADER -->

    <div class="graph-header">

        <div class="graph-title">
            LIVE SPEED GRAPH
        </div>

        <div class="legend">

            <div class="legend-item">

                <span
                    class="legend-dot red">
                </span>

                Download

            </div>


            <div class="legend-item">

                <span
                    class="legend-dot green">
                </span>

                Upload

            </div>

        </div>

    </div>


    <!-- GRAPH -->

    <div class="graph-box">

        <canvas
            id="speedGraph">
        </canvas>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            id="startButton"
            class="start"
            onclick="startTest()">

            ▶ START

        </button>


        <button
            id="stopButton"
            class="stop"
            onclick="stopTest()"
            disabled>

            ■ STOP

        </button>

    </div>


    <div class="note">

        Press START to continuously monitor your
        connection. Press STOP whenever you want
        to stop the test.

    </div>


</div>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
document.getElementById(
    "speedGraph"
);

const ctx =
canvas.getContext("2d");


const mainSpeed =
document.getElementById(
    "mainSpeed"
);

const mainUnit =
document.getElementById(
    "mainUnit"
);

const statusText =
document.getElementById(
    "status"
);

const downloadElement =
document.getElementById(
    "download"
);

const downloadUnitElement =
document.getElementById(
    "downloadUnit"
);

const uploadElement =
document.getElementById(
    "upload"
);

const uploadUnitElement =
document.getElementById(
    "uploadUnit"
);

const startButton =
document.getElementById(
    "startButton"
);

const stopButton =
document.getElementById(
    "stopButton"
);


/* =====================================================
   VARIABLES
===================================================== */

let running = false;

let testTimer = null;

let downloadHistory = [];

let uploadHistory = [];

const MAX_POINTS = 50;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    const rect =
    canvas.getBoundingClientRect();

    const ratio =
    window.devicePixelRatio || 1;


    canvas.width =
    rect.width * ratio;

    canvas.height =
    rect.height * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   FORMAT SPEED
===================================================== */

function formatSpeed(mbps){

    if(
        !isFinite(mbps) ||
        mbps <= 0
    ){

        return {
            value:"0",
            unit:"KBPS"
        };

    }


    if(mbps < 1){

        return {

            value:
                (mbps * 1024)
                .toFixed(0),

            unit:"KBPS"

        };

    }


    return {

        value:
            mbps.toFixed(2),

        unit:"MBPS"

    };

}


/* =====================================================
   UPDATE UI
===================================================== */

function updateUI(
    downloadMbps,
    uploadMbps
){

    const d =
    formatSpeed(
        downloadMbps
    );

    const u =
    formatSpeed(
        uploadMbps
    );


    downloadElement.textContent =
    d.value;

    downloadUnitElement.textContent =
    d.unit;


    uploadElement.textContent =
    u.value;

    uploadUnitElement.textContent =
    u.unit;


    /*
       Main speed = Download
    */

    mainSpeed.textContent =
    d.value;

    mainUnit.textContent =
    d.unit;


    downloadHistory.push(
        Math.max(
            0,
            downloadMbps
        )
    );


    uploadHistory.push(
        Math.max(
            0,
            uploadMbps
        )
    );


    if(
        downloadHistory.length >
        MAX_POINTS
    ){

        downloadHistory.shift();

    }


    if(
        uploadHistory.length >
        MAX_POINTS
    ){

        uploadHistory.shift();

    }


    drawGraph();

}


/* =====================================================
   DOWNLOAD TEST
===================================================== */

async function downloadTest(){

    /*
       Random cache value prevents
       browser cache.
    */

    const url =
        "https://speed.cloudflare.com/__down?bytes=3000000&x="
        + Date.now();


    const start =
        performance.now();


    const response =
        await fetch(
            url,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(
            "Download failed"
        );

    }


    const reader =
        response.body.getReader();


    let totalBytes = 0;

    let lastBytes = 0;

    let lastTime =
        performance.now();


    while(running){

        const result =
        await reader.read();


        if(result.done){

            break;

        }


        totalBytes +=
        result.value.byteLength;


        const now =
        performance.now();


        const elapsed =
        (now - lastTime) / 1000;


        if(elapsed >= .1){

            const bytes =
            totalBytes -
            lastBytes;


            const mbps =
            (
                bytes * 8
            )
            /
            elapsed
            /
            1000000;


            updateUI(
                mbps,
                0
            );


            lastBytes =
            totalBytes;

            lastTime =
            now;

        }

    }


    return totalBytes;

}


/* =====================================================
   UPLOAD TEST
===================================================== */

async function uploadTest(){

    /*
       Upload test data.
    */

    const size =
        1024 * 1024;


    const data =
        new Uint8Array(size);


    /*
       Fill test data.
    */

    crypto.getRandomValues(
        data.subarray(
            0,
            Math.min(
                data.length,
                65536
            )
        )
    );


    const start =
    performance.now();


    try{

        const response =
        await fetch(
            "https://speed.cloudflare.com/__up",
            {
                method:"POST",

                body:data,

                cache:"no-store"
            }
        );


        if(!response.ok){

            return 0;

        }


    }
    catch(error){

        return 0;

    }


    const elapsed =
    (performance.now() - start)
    / 1000;


    if(elapsed <= 0){

        return 0;

    }


    return (
        size * 8
    )
    /
    elapsed
    /
    1000000;

}


/* =====================================================
   CONTINUOUS TEST
===================================================== */

async function runTest(){

    while(running){

        try{

            statusText.textContent =
            "Testing Download...";


            /*
               Download measurement
            */

            await downloadTest();


            if(!running){

                break;

            }


            /*
               Upload measurement
            */

            statusText.textContent =
            "Testing Upload...";


            const upload =
            await uploadTest();


            if(!running){

                break;

            }


            /*
               Show upload result
            */

            const lastDownload =
            downloadHistory.length
            ? downloadHistory[
                downloadHistory.length - 1
            ]
            : 0;


            updateUI(
                lastDownload,
                upload
            );


            statusText.textContent =
            "● LIVE";


        }
        catch(error){

            console.error(error);


            if(running){

                statusText.textContent =
                "Connection Error";

            }

        }


        /*
           Small pause before next test
        */

        await new Promise(
            resolve =>
            setTimeout(
                resolve,
                300
            )
        );

    }

}


/* =====================================================
   START
===================================================== */

function startTest(){

    if(running){

        return;

    }


    running = true;


    startButton.disabled =
    true;


    stopButton.disabled =
    false;


    statusText.textContent =
    "● LIVE";


    /*
       Start continuous testing
    */

    runTest();

}


/* =====================================================
   STOP
===================================================== */

function stopTest(){

    running = false;


    startButton.disabled =
    false;


    stopButton.disabled =
    true;


    statusText.textContent =
    "Stopped";


}


/* =====================================================
   INITIAL GRAPH
===================================================== */

resizeCanvas();


/* =====================================================
   INITIAL VALUES
===================================================== */

updateUI(
    0,
    0
);

</script>


</body>

</html>
