<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Internet Speed Test</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#f3f6f4;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    color:#222;
}

.card{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.title{
    text-align:center;
    color:#0b5d3b;
    font-size:23px;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:5px;
    margin-bottom:20px;
}


/* MAIN SPEED */

.main-speed{
    width:175px;
    height:175px;
    margin:auto;

    border-radius:50%;

    border:8px solid #e4ece7;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.main-number{
    font-size:38px;
    font-weight:bold;
    color:#0b5d3b;
}

.main-unit{
    font-size:12px;
    color:#777;
    font-weight:bold;
}

.status{
    font-size:11px;
    color:#777;
    margin-top:6px;
}


/* VALUES */

.values{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.value-box{
    background:#f7f9f8;
    border:1px solid #e1e6e3;
    border-radius:12px;
    padding:14px;
}

.value-title{
    font-size:11px;
    font-weight:bold;
    margin-bottom:6px;
}

.download{
    color:#e00000;
}

.upload{
    color:#07994f;
}

.value-number{
    font-size:22px;
    font-weight:bold;
}

.value-unit{
    font-size:10px;
    color:#777;
    font-weight:bold;
}


/* GRAPH */

.graph-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    margin-bottom:8px;
}

.graph-title-text{
    font-size:13px;
    font-weight:bold;
    color:#555;
}

.legend{
    display:flex;
    gap:12px;
    font-size:10px;
    font-weight:bold;
}

.legend span{
    display:flex;
    align-items:center;
    gap:4px;
}

.red-dot,
.green-dot{
    width:18px;
    height:3px;
    border-radius:5px;
}

.red-dot{
    background:#e00000;
}

.green-dot{
    background:#07994f;
}

.graph{
    width:100%;
    height:230px;
    background:#f8faf9;
    border:1px solid #e3e8e5;
    border-radius:12px;
    overflow:hidden;
}

#canvas{
    width:100%;
    height:100%;
    display:block;
}


/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

button{
    border:0;
    padding:14px;
    border-radius:10px;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.start{
    background:#0b5d3b;
}

.stop{
    background:#c62828;
}

button:disabled{
    opacity:.45;
}


/* NOTE */

.note{
    text-align:center;
    font-size:10px;
    color:#999;
    line-height:1.5;
    margin-top:12px;
}


/* MOBILE */

@media(max-width:500px){

    .card{
        padding:17px;
    }

    .main-speed{
        width:160px;
        height:160px;
    }

    .main-number{
        font-size:34px;
    }

    .graph{
        height:200px;
    }

}

</style>

</head>

<body>


<div class="card">


    <div class="title">
        Internet Speed Test
    </div>

    <div class="subtitle">
        Live Download & Upload Speed
    </div>


    <!-- MAIN SPEED -->

    <div class="main-speed">

        <div
            id="mainNumber"
            class="main-number">
            0
        </div>

        <div
            id="mainUnit"
            class="main-unit">
            KBPS
        </div>

        <div
            id="status"
            class="status">
            Ready
        </div>

    </div>


    <!-- DOWNLOAD / UPLOAD -->

    <div class="values">


        <div class="value-box">

            <div class="value-title download">
                🔴 DOWNLOAD
            </div>

            <span
                id="downloadValue"
                class="value-number">
                0
            </span>

            <span
                id="downloadUnit"
                class="value-unit">
                KBPS
            </span>

        </div>


        <div class="value-box">

            <div class="value-title upload">
                🟢 UPLOAD
            </div>

            <span
                id="uploadValue"
                class="value-number">
                0
            </span>

            <span
                id="uploadUnit"
                class="value-unit">
                KBPS
            </span>

        </div>


    </div>


    <!-- GRAPH HEADER -->

    <div class="graph-title">

        <div class="graph-title-text">
            LIVE GRAPH
        </div>

        <div class="legend">

            <span>
                <i class="red-dot"></i>
                Download
            </span>

            <span>
                <i class="green-dot"></i>
                Upload
            </span>

        </div>

    </div>


    <!-- GRAPH -->

    <div class="graph">

        <canvas id="canvas"></canvas>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            id="start"
            class="start">
            ▶ START
        </button>

        <button
            id="stop"
            class="stop"
            disabled>
            ■ STOP
        </button>

    </div>


    <div class="note">
        START keeps the test running continuously.
        Press STOP to stop the test.
    </div>


</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");


const mainNumber =
document.getElementById("mainNumber");

const mainUnit =
document.getElementById("mainUnit");

const statusText =
document.getElementById("status");


const downloadValue =
document.getElementById("downloadValue");

const downloadUnit =
document.getElementById("downloadUnit");


const uploadValue =
document.getElementById("uploadValue");

const uploadUnit =
document.getElementById("uploadUnit");


/* =====================================================
   VARIABLES
===================================================== */

let running = false;

let downloadData = [];

let uploadData = [];

const MAX_POINTS = 60;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   FORMAT
===================================================== */

function formatSpeed(mbps){

    if(
        !isFinite(mbps) ||
        mbps <= 0
    ){

        return {
            value:"0",
            unit:"KBPS"
        };

    }


    if(mbps < 1){

        return {
            value:
                Math.round(
                    mbps * 1024
                ),

            unit:"KBPS"
        };

    }


    return {
        value:
            mbps.toFixed(2),

        unit:"MBPS"
    };

}


/* =====================================================
   UPDATE VALUES
===================================================== */

function updateValues(
    download,
    upload
){

    const d =
        formatSpeed(download);

    const u =
        formatSpeed(upload);


    downloadValue.textContent =
        d.value;

    downloadUnit.textContent =
        d.unit;


    uploadValue.textContent =
        u.value;

    uploadUnit.textContent =
        u.unit;


    mainNumber.textContent =
        d.value;

    mainUnit.textContent =
        d.unit;


    downloadData.push(
        download
    );

    uploadData.push(
        upload
    );


    if(
        downloadData.length >
        MAX_POINTS
    ){

        downloadData.shift();

    }


    if(
        uploadData.length >
        MAX_POINTS
    ){

        uploadData.shift();

    }


    drawGraph();

}


/* =====================================================
   DRAW GRAPH
===================================================== */

function drawGraph(){

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
       GRID
    */

    ctx.strokeStyle =
        "#e2e8e4";

    ctx.lineWidth = 1;


    for(
        let i = 1;
        i < 5;
        i++
    ){

        const y =
            height / 5 * i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /*
       NO DATA
    */

    if(
        downloadData.length === 0
    ){

        return;

    }


    /*
       FIND MAX
    */

    const allData =
        downloadData.concat(
            uploadData
        );


    let max =
        Math.max(
            ...allData,
            0.01
        );


    /*
       Give graph some headroom
    */

    max *= 1.15;


    drawLine(
        downloadData,
        "#e00000",
        width,
        height,
        max
    );


    drawLine(
        uploadData,
        "#07994f",
        width,
        height,
        max
    );

}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(
    data,
    color,
    width,
    height,
    max
){

    if(data.length === 0){

        return;

    }


    ctx.beginPath();


    data.forEach(
        (value,index)=>{

            let x;


            if(data.length === 1){

                x =
                    width / 2;

            }
            else{

                x =
                    (
                        index /
                        (
                            data.length - 1
                        )
                    ) * width;

            }


            let y =
                height -
                (
                    value / max
                ) *
                (
                    height - 15
                ) -
                7;


            /*
               Keep point inside graph
            */

            y =
                Math.max(
                    5,
                    Math.min(
                        height - 5,
                        y
                    )
                );


            if(index === 0){

                ctx.moveTo(
                    x,
                    y
                );

            }
            else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        color;

    ctx.lineWidth = 3;

    ctx.lineJoin =
        "round";

    ctx.lineCap =
        "round";


    ctx.stroke();

}


/* =====================================================
   DOWNLOAD TEST
===================================================== */

async function downloadTest(){

    /*
       Multiple small requests make the
       graph update more frequently.
    */

    const url =
        "https://speed.cloudflare.com/__down?bytes=1000000&x="
        + Date.now();


    const startTime =
        performance.now();


    const response =
        await fetch(
            url,
            {
                cache:"no-store"
            }
        );


    if(
        !response.ok
    ){

        throw new Error(
            "Download failed"
        );

    }


    const reader =
        response.body.getReader();


    let totalBytes = 0;

    let lastBytes = 0;

    let lastTime =
        performance.now();


    while(running){

        const result =
            await reader.read();


        if(result.done){

            break;

        }


        totalBytes +=
            result.value.byteLength;


        const now =
            performance.now();


        const elapsed =
            (
                now -
                lastTime
            ) / 1000;


        /*
           Update graph approximately
           every 0.1 second
        */

        if(
            elapsed >= 0.1
        ){

            const bytes =
                totalBytes -
                lastBytes;


            const mbps =
                (
                    bytes * 8
                )
                /
                elapsed
                /
                1000000;


            updateValues(
                mbps,
                0
            );


            lastBytes =
                totalBytes;

            lastTime =
                now;

        }

    }


}


/* =====================================================
   UPLOAD TEST
===================================================== */

async function uploadTest(){

    const size =
        1024 * 1024;


    const data =
        new Uint8Array(
            size
        );


    /*
       Fill enough random data
       to prevent simple compression.
    */

    for(
        let i = 0;
        i < data.length;
        i += 65536
    ){

        crypto.getRandomValues(
            data.subarray(
                i,
                Math.min(
                    i + 65536,
                    data.length
                )
            )
        );

    }


    const startTime =
        performance.now();


    try{

        const response =
            await fetch(
                "https://speed.cloudflare.com/__up",
                {
                    method:"POST",
                    body:data,
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            return 0;

        }


    }
    catch(error){

        return 0;

    }


    const elapsed =
        (
            performance.now() -
            startTime
        ) / 1000;


    if(
        elapsed <= 0
    ){

        return 0;

    }


    return (
        size * 8
    )
    /
    elapsed
    /
    1000000;

}


/* =====================================================
   CONTINUOUS LOOP
===================================================== */

async function runTest(){

    while(running){

        try{

            statusText.textContent =
                "Testing Download...";


            await downloadTest();


            if(!running){

                break;

            }


            statusText.textContent =
                "Testing Upload...";


            const upload =
                await uploadTest();


            if(!running){

                break;

            }


            const lastDownload =
                downloadData.length
                ? downloadData[
                    downloadData.length - 1
                ]
                : 0;


            updateValues(
                lastDownload,
                upload
            );


            statusText.textContent =
                "● LIVE";


        }
        catch(error){

            console.log(
                error
            );


            if(running){

                statusText.textContent =
                    "Connection Error";

            }

        }


        /*
           Continue automatically
        */

        if(running){

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        200
                    )
            );

        }

    }

}


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    function(){

        if(running){

            return;

        }


        running = true;


        startButton.disabled =
            true;

        stopButton.disabled =
            false;


        statusText.textContent =
            "● LIVE";


        runTest();

    }
);


/* =====================================================
   STOP
===================================================== */

stopButton.addEventListener(
    "click",
    function(){

        running = false;


        startButton.disabled =
            false;

        stopButton.disabled =
            true;


        statusText.textContent =
            "Stopped";

    }
);


/* =====================================================
   INITIAL
===================================================== */

resizeCanvas();

drawGraph();

</script>

</body>
</html>
