<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Data Management</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#f4f7f6;
    --card:#ffffff;
    --text:#17201c;
    --muted:#718078;
    --border:#dfe7e3;
    --green:#087f4b;
    --green2:#00b86b;
    --red:#dc3545;
    --blue:#1683ff;
    --shadow:0 10px 35px rgba(0,0,0,.07);
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
}


/* =========================
   HEADER
========================= */

.header{
    height:68px;

    background:var(--card);

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    position:sticky;
    top:0;

    z-index:1000;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:20px;
    font-weight:bold;

    color:var(--green);
}

.logo-icon{
    width:38px;
    height:38px;

    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    background:
        linear-gradient(
            135deg,
            #00b86b,
            #087f4b
        );

    box-shadow:
        0 7px 20px rgba(0,150,90,.22);
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}


/* =========================
   BUTTON
========================= */

button{
    border:0;
    cursor:pointer;
}

.btn{
    min-height:40px;

    padding:0 15px;

    border-radius:9px;

    font-size:13px;

    font-weight:bold;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-green{
    background:var(--green);
    color:white;
}

.btn-blue{
    background:var(--blue);
    color:white;
}

.btn-red{
    background:var(--red);
    color:white;
}

.btn-light{
    background:#edf3f0;
    color:#26332d;
}


/* =========================
   MAIN
========================= */

.main{
    width:100%;
    max-width:1500px;

    margin:auto;

    padding:24px;
}


/* =========================
   TOP
========================= */

.top-section{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;
}

.page-title h1{
    font-size:25px;
    margin-bottom:5px;
}

.page-title p{
    color:var(--muted);
    font-size:13px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}


/* =========================
   CARDS
========================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-bottom:20px;
}

.stat{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:15px;

    padding:18px;

    box-shadow:var(--shadow);

    display:flex;

    align-items:center;

    gap:14px;
}

.stat-icon{
    width:46px;
    height:46px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;

    background:#e8f7f0;
}

.stat-title{
    color:var(--muted);
    font-size:11px;
    font-weight:bold;

    margin-bottom:5px;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
}


/* =========================
   TABLE CARD
========================= */

.table-card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:16px;

    box-shadow:var(--shadow);

    overflow:hidden;
}


/* =========================
   TABLE TOP
========================= */

.table-top{
    padding:15px;

    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:12px;

    border-bottom:1px solid var(--border);
}

.search{
    width:320px;
    max-width:100%;

    height:42px;

    border:1px solid var(--border);

    border-radius:10px;

    outline:none;

    padding:0 13px;

    font-size:13px;

    background:#fafcfb;
}

.search:focus{
    border-color:var(--green);
}


/* =========================
   TABLE
========================= */

.table-wrapper{
    width:100%;
    overflow:auto;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:800px;
}

thead{
    background:#f5f8f6;
}

th{
    padding:13px 14px;

    text-align:left;

    font-size:11px;

    color:#53625a;

    white-space:nowrap;

    border-bottom:1px solid var(--border);
}

td{
    padding:13px 14px;

    font-size:13px;

    border-bottom:1px solid #edf1ef;

    white-space:nowrap;

    max-width:250px;

    overflow:hidden;

    text-overflow:ellipsis;
}

tbody tr:hover{
    background:#f9fcfa;
}

.actions-cell{
    display:flex;
    gap:6px;
}


/* =========================
   EMPTY
========================= */

.empty{
    padding:50px 20px;

    text-align:center;

    color:var(--muted);
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}


/* =========================
   LOADING
========================= */

.loading{
    padding:45px;

    text-align:center;

    color:var(--muted);
}

.spinner{
    width:32px;
    height:32px;

    margin:0 auto 12px;

    border:3px solid #dfe9e4;

    border-top-color:var(--green);

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:5000;

    backdrop-filter:blur(4px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:650px;

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:18px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.30);

    animation:modalIn .2s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(10px) scale(.98);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.modal-header{
    padding:18px 20px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid var(--border);
}

.modal-title{
    font-size:18px;
    font-weight:bold;
}

.close{
    width:32px;
    height:32px;

    border-radius:8px;

    background:#f1f4f2;

    font-size:18px;
}

.modal-body{
    padding:20px;
}


/* =========================
   FORM
========================= */

.form-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:11px;

    font-weight:bold;

    color:#647169;
}

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    min-height:43px;

    border:1px solid var(--border);

    border-radius:9px;

    outline:none;

    padding:10px 12px;

    font-size:13px;

    background:#fafcfb;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--green);

    box-shadow:
        0 0 0 3px
        rgba(8,127,75,.08);
}

.modal-footer{
    padding:15px 20px;

    display:flex;

    justify-content:flex-end;

    gap:8px;

    border-top:1px solid var(--border);
}


/* =========================
   VIEW MODAL
========================= */

.view-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;
}

.view-item{
    padding:13px;

    background:#f7faf8;

    border:1px solid var(--border);

    border-radius:10px;
}

.view-label{
    font-size:10px;

    color:var(--muted);

    font-weight:bold;

    margin-bottom:5px;
}

.view-value{
    font-size:13px;

    font-weight:bold;

    word-break:break-word;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    right:20px;
    bottom:20px;

    min-width:240px;

    max-width:350px;

    padding:13px 16px;

    background:#17201c;

    color:white;

    border-radius:10px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);

    font-size:13px;

    transform:
        translateY(100px);

    opacity:0;

    pointer-events:none;

    transition:.3s;

    z-index:9999;
}

.toast.show{
    transform:none;
    opacity:1;
}

.toast.success{
    border-left:4px solid #00b86b;
}

.toast.error{
    border-left:4px solid #dc3545;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .main{
        padding:15px;
    }

    .top-section{
        align-items:flex-start;
        flex-direction:column;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .table-top{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }

}

@media(max-width:550px){

    .header{
        padding:0 13px;
    }

    .logo{
        font-size:16px;
    }

    .header-right .btn{
        padding:0 10px;
    }

    .main{
        padding:12px;
    }

    .page-title h1{
        font-size:21px;
    }

    .form-grid,
    .view-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">

        <div class="logo-icon">
            📊
        </div>

        Data Management

    </div>


    <div class="header-right">

        <button
            class="btn btn-light"
            onclick="loadData()">

            🔄 Refresh

        </button>

        <button
            class="btn btn-green"
            onclick="openAddModal()">

            ＋ Add

        </button>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <div class="top-section">

        <div class="page-title">

            <h1>
                Customer Data
            </h1>

            <p>
                View and manage your Google Sheet data
            </p>

        </div>


        <div class="actions">

            <button
                class="btn btn-green"
                onclick="openAddModal()">

                ＋ Add New

            </button>

        </div>

    </div>



    <!-- =========================
         STATS
    ========================= -->

    <div class="stats">


        <div class="stat">

            <div class="stat-icon">
                👥
            </div>

            <div>

                <div class="stat-title">
                    TOTAL RECORDS
                </div>

                <div
                    id="totalRecords"
                    class="stat-value">

                    0

                </div>

            </div>

        </div>



        <div class="stat">

            <div class="stat-icon">
                📋
            </div>

            <div>

                <div class="stat-title">
                    COLUMNS
                </div>

                <div
                    id="totalColumns"
                    class="stat-value">

                    0

                </div>

            </div>

        </div>



        <div class="stat">

            <div class="stat-icon">
                🟢
            </div>

            <div>

                <div class="stat-title">
                    STATUS
                </div>

                <div
                    id="serverStatus"
                    class="stat-value">

                    Online

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         TABLE
    ========================= -->

    <section class="table-card">


        <div class="table-top">

            <input
                id="searchInput"
                class="search"
                type="text"
                placeholder="🔍 Search data..."
                oninput="searchData()">


            <button
                class="btn btn-light"
                onclick="clearSearch()">

                Clear

            </button>

        </div>



        <div
            id="tableArea"
            class="table-wrapper">

            <div class="loading">

                <div class="spinner"></div>

                Loading data...

            </div>

        </div>


    </section>


</main>



<!-- =========================
     ADD / EDIT MODAL
========================= -->

<div
    id="formModal"
    class="modal">

    <div class="modal-box">


        <div class="modal-header">

            <div
                id="formTitle"
                class="modal-title">

                Add New Data

            </div>

            <button
                class="close"
                onclick="closeFormModal()">

                ×

            </button>

        </div>


        <div
            id="formBody"
            class="modal-body">

        </div>


        <div class="modal-footer">

            <button
                class="btn btn-light"
                onclick="closeFormModal()">

                Cancel

            </button>

            <button
                id="saveButton"
                class="btn btn-green"
                onclick="saveData()">

                Save

            </button>

        </div>


    </div>

</div>



<!-- =========================
     VIEW MODAL
========================= -->

<div
    id="viewModal"
    class="modal">

    <div class="modal-box">


        <div class="modal-header">

            <div class="modal-title">
                View Details
            </div>

            <button
                class="close"
                onclick="closeViewModal()">

                ×

            </button>

        </div>


        <div
            id="viewBody"
            class="modal-body">

        </div>


    </div>

</div>



<!-- =========================
     TOAST
========================= -->

<div
    id="toast"
    class="toast">

</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwEda0meR5ZzPbUZqH_5dpbIQWt1Z7fArv6adM5yRMGMDYwOkkZn-O1bZ0v4xHFTuGmwA/exec";


/* =====================================================
   GLOBAL DATA
===================================================== */

let headers = [];

let rows = [];

let filteredRows = [];

let editingIndex = -1;


/* =====================================================
   INITIAL LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        loadData();

    }
);


/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

    const area =
        document.getElementById(
            "tableArea"
        );


    area.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading data...

        </div>

    `;


    try{

        const response =
            await fetch(
                API_URL +
                "?action=getData" +
                "&_=" +
                Date.now()
            );


        const result =
            await response.json();


        console.log(
            "GET DATA:",
            result
        );


        if(
            result.success === false
        ){

            throw new Error(
                result.message ||
                "Unable to load data"
            );

        }


        /*
        =========================================
        SUPPORT DIFFERENT RESPONSE STRUCTURES
        =========================================
        */

        headers =
            result.headers ||
            result.header ||
            [];


        rows =
            result.data ||
            result.rows ||
            [];


        /*
        If API returns array directly
        */

        if(
            Array.isArray(result)
        ){

            if(result.length){

                headers =
                    result[0];

                rows =
                    result.slice(1);

            }

        }


        /*
        Object based data
        */

        if(
            !headers.length &&
            rows.length &&
            typeof rows[0] === "object" &&
            !Array.isArray(rows[0])
        ){

            headers =
                Object.keys(
                    rows[0]
                );

            rows =
                rows.map(
                    item =>
                        headers.map(
                            h => item[h]
                        )
                );

        }


        filteredRows =
            [...rows];


        updateStats();

        renderTable();


        document.getElementById(
            "serverStatus"
        ).textContent =
            "Online";


    }

    catch(error){

        console.error(error);


        document.getElementById(
            "serverStatus"
        ).textContent =
            "Offline";


        area.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <b>
                    Unable to load data
                </b>

                <p style="margin-top:8px">
                    ${escapeHTML(error.message)}
                </p>

                <button
                    class="btn btn-green"
                    style="margin-top:15px"
                    onclick="loadData()">

                    Try Again

                </button>

            </div>

        `;

    }

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "totalRecords"
    ).textContent =
        rows.length;


    document.getElementById(
        "totalColumns"
    ).textContent =
        headers.length;

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(){

    const area =
        document.getElementById(
            "tableArea"
        );


    if(!headers.length){

        area.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                No column found

            </div>

        `;

        return;

    }


    if(!filteredRows.length){

        area.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                No data found

            </div>

        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

    `;


    headers.forEach(
        function(header){

            html += `

                <th>
                    ${escapeHTML(header)}
                </th>

            `;

        }
    );


    html += `

                    <th>
                        ACTION
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    filteredRows.forEach(
        function(row){

            const originalIndex =
                rows.indexOf(row);


            html += `<tr>`;


            headers.forEach(
                function(_,i){

                    html += `

                        <td title="${escapeHTML(
                            row[i] ?? ""
                        )}">

                            ${escapeHTML(
                                row[i] ?? ""
                            )}

                        </td>

                    `;

                }
            );


            html += `

                <td>

                    <div class="actions-cell">

                        <button
                            class="btn btn-light"
                            onclick="viewRow(${originalIndex})">

                            👁 View

                        </button>

                        <button
                            class="btn btn-blue"
                            onclick="editRow(${originalIndex})">

                            ✏️ Edit

                        </button>

                        <button
                            class="btn btn-red"
                            onclick="deleteRow(${originalIndex})">

                            🗑 Delete

                        </button>

                    </div>

                </td>

            `;


            html += `</tr>`;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    area.innerHTML =
        html;

}


/* =====================================================
   SEARCH
===================================================== */

function searchData(){

    const query =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    if(!query){

        filteredRows =
            [...rows];

        renderTable();

        return;

    }


    filteredRows =
        rows.filter(
            function(row){

                return row.some(
                    function(value){

                        return String(
                            value ?? ""
                        )
                        .toLowerCase()
                        .includes(query);

                    }
                );

            }
        );


    renderTable();

}


/* =====================================================
   CLEAR SEARCH
===================================================== */

function clearSearch(){

    document.getElementById(
        "searchInput"
    ).value = "";


    filteredRows =
        [...rows];


    renderTable();

}


/* =====================================================
   ADD MODAL
===================================================== */

function openAddModal(){

    editingIndex =
        -1;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add New Data";


    createForm([]);


    document.getElementById(
        "formModal"
    ).classList.add(
        "show"
    );

}


/* =====================================================
   EDIT
===================================================== */

function editRow(index){

    if(
        !rows[index]
    ){

        return;

    }


    editingIndex =
        index;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Data";


    createForm(
        rows[index]
    );


    document.getElementById(
        "formModal"
    ).classList.add(
        "show"
    );

}


/* =====================================================
   CREATE FORM
===================================================== */

function createForm(values){

    const body =
        document.getElementById(
            "formBody"
        );


    let html =
        `<div class="form-grid">`;


    headers.forEach(
        function(header,index){

            const value =
                values[index] ??
                "";


            html += `

                <div class="form-group">

                    <label>
                        ${escapeHTML(header)}
                    </label>

                    <input
                        type="text"
                        data-column="${index}"
                        value="${escapeAttribute(value)}"
                        placeholder="Enter ${escapeAttribute(header)}">

                </div>

            `;

        }
    );


    html +=
        `</div>`;


    body.innerHTML =
        html;

}


/* =====================================================
   SAVE
===================================================== */

async function saveData(){

    const button =
        document.getElementById(
            "saveButton"
        );


    const inputs =
        document.querySelectorAll(
            "#formBody input"
        );


    const values =
        Array.from(inputs)
        .map(
            input =>
                input.value
        );


    if(
        values.every(
            value =>
                !String(value).trim()
        )
    ){

        showToast(
            "Please enter some data.",
            "error"
        );

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "Saving...";


    try{

        let action;


        if(editingIndex === -1){

            action =
                "addData";

        }
        else{

            action =
                "updateData";

        }


        const payload = {

            action:action,

            rowIndex:
                editingIndex,

            data:values

        };


        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const result =
            await response.json();


        console.log(
            "SAVE:",
            result
        );


        if(
            result.success === false
        ){

            throw new Error(
                result.message ||
                "Save failed"
            );

        }


        closeFormModal();


        showToast(
            editingIndex === -1
                ? "Data added successfully."
                : "Data updated successfully.",
            "success"
        );


        await loadData();

    }

    catch(error){

        console.error(error);


        showToast(
            error.message ||
            "Unable to save data.",
            "error"
        );

    }


    button.disabled =
        false;

    button.textContent =
        "Save";

}


/* =====================================================
   DELETE
===================================================== */

async function deleteRow(index){

    if(
        !rows[index]
    ){

        return;

    }


    const ok =
        confirm(
            "Are you sure you want to delete this data?"
        );


    if(!ok){

        return;

    }


    try{

        showToast(
            "Deleting...",
            ""
        );


        const payload = {

            action:"deleteData",

            rowIndex:index

        };


        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const result =
            await response.json();


        console.log(
            "DELETE:",
            result
        );


        if(
            result.success === false
        ){

            throw new Error(
                result.message ||
                "Delete failed"
            );

        }


        showToast(
            "Data deleted successfully.",
            "success"
        );


        await loadData();

    }

    catch(error){

        console.error(error);


        showToast(
            error.message ||
            "Unable to delete data.",
            "error"
        );

    }

}


/* =====================================================
   VIEW
===================================================== */

function viewRow(index){

    const row =
        rows[index];


    if(!row){

        return;

    }


    let html =
        `<div class="view-grid">`;


    headers.forEach(
        function(header,i){

            html += `

                <div class="view-item">

                    <div class="view-label">

                        ${escapeHTML(
                            header
                        )}

                    </div>

                    <div class="view-value">

                        ${escapeHTML(
                            row[i] ?? "-"
                        )}

                    </div>

                </div>

            `;

        }
    );


    html +=
        `</div>`;


    document.getElementById(
        "viewBody"
    ).innerHTML =
        html;


    document.getElementById(
        "viewModal"
    ).classList.add(
        "show"
    );

}


/* =====================================================
   CLOSE FORM
===================================================== */

function closeFormModal(){

    document.getElementById(
        "formModal"
    ).classList.remove(
        "show"
    );

}


/* =====================================================
   CLOSE VIEW
===================================================== */

function closeViewModal(){

    document.getElementById(
        "viewModal"
    ).classList.remove(
        "show"
    );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(
    text,
    type
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        text;


    toast.className =
        "toast show " +
        (
            type || ""
        );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

    return escapeHTML(
        value
    );

}


/* =====================================================
   CLICK OUTSIDE MODAL
===================================================== */

document.getElementById(
    "formModal"
).addEventListener(
    "click",
    function(e){

        if(
            e.target === this
        ){

            closeFormModal();

        }

    }
);


document.getElementById(
    "viewModal"
).addEventListener(
    "click",
    function(e){

        if(
            e.target === this
        ){

            closeViewModal();

        }

    }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            closeFormModal();

            closeViewModal();

        }

    }
);

</script>
