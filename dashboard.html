<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#222;
    --muted:#777;
    --border:#dddddd;
    --green:#0b5d3b;
}

body.dark{
    --bg:#000000;
    --card:#111111;
    --text:#ffffff;
    --muted:#aaaaaa;
    --border:#292929;
    --green:#19a866;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    transition:.25s;
}


/* =========================
   THEME BUTTON
========================= */

.theme-button{
    position:fixed;
    top:5px;
    right:5px;

    width:25px;
    height:25px;

    border:1px solid var(--border);
    border-radius:50%;

    background:var(--card);
    color:var(--text);

    font-size:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:9999;
}


/* =========================
   HEADER
========================= */

.header{
    height:65px;

    background:var(--card);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:100;
}

.title{
    font-size:20px;
    font-weight:bold;
    color:var(--green);
}

.logout{
    border:0;
    background:var(--green);
    color:white;

    padding:10px 17px;

    border-radius:8px;

    font-size:14px;
    font-weight:bold;

    cursor:pointer;
}


/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:650px;

    margin:auto;

    padding:22px 16px 40px;
}


/* =========================
   USERNAME PASSWORD
========================= */

.top{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:12px;
}

.box{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;
}

.label{
    font-size:12px;
    font-weight:bold;
    color:var(--muted);

    margin-bottom:7px;
}

.value{
    font-size:16px;
    font-weight:bold;
    color:var(--text);
}


/* =========================
   MAC
========================= */

.mac-box{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:18px;
}

.mac-title{
    font-size:12px;
    color:var(--muted);
    font-weight:bold;
    margin-bottom:7px;
}

.mac-value{
    font-size:17px;
    font-weight:bold;
    color:var(--text);
    word-break:break-all;
}


/* =========================
   PHOTO
========================= */

.photo-box{
    width:100%;

    display:flex;

    justify-content:center;

    margin:5px 0 22px;
}

.photo{
    width:220px;
    height:220px;

    border-radius:50%;

    overflow:hidden;

    background:#dff0e8;

    border:6px solid var(--card);

    box-shadow:
        0 7px 28px rgba(0,0,0,.18);
}

.photo svg{
    width:100%;
    height:100%;
    display:block;
}


/* =========================
   SPEED BOX
========================= */

.speed-box{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:14px;

    padding:14px;

    margin-bottom:14px;
}

.speed-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.speed-title-button{
    flex:1;

    border:0;

    background:transparent;

    color:var(--muted);

    text-align:left;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    padding:4px 0;
}

.speed-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.speed-live{
    font-size:10px;

    font-weight:bold;

    color:#08783d;

    background:#e8f7ef;

    padding:5px 8px;

    border-radius:6px;
}

.manage-button{
    width:28px;
    height:28px;

    border:1px solid var(--border);

    border-radius:7px;

    background:var(--bg);

    color:var(--text);

    cursor:pointer;

    font-size:13px;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   SPEED CONTENT
========================= */

.speed-content{
    margin-top:15px;

    transition:
        max-height .3s ease,
        opacity .2s ease,
        margin .3s ease;

    max-height:600px;

    overflow:hidden;

    opacity:1;
}

.speed-box.minimized .speed-content{
    max-height:0;
    opacity:0;
    margin-top:0;
}


/* =========================
   SPEED VALUES
========================= */

.speed-values{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:18px;
}

.speed-value-box{
    border:1px solid var(--border);

    border-radius:10px;

    padding:12px;

    background:var(--bg);
}

.speed-value-title{
    font-size:11px;

    font-weight:bold;

    margin-bottom:5px;
}

.download-title{
    color:#e00000;
}

.upload-title{
    color:#0b9b54;
}

.speed-value{
    font-size:24px;

    font-weight:bold;

    color:var(--text);
}

.speed-unit{
    font-size:11px;

    color:var(--muted);

    font-weight:bold;
}


/* =========================
   GRAPH LEGEND
========================= */

.graph-legend{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:25px;

    margin-bottom:10px;
}

.legend{
    display:flex;

    align-items:center;

    gap:6px;

    font-size:12px;

    font-weight:bold;

    color:var(--text);
}

.legend-line{
    width:25px;

    height:3px;

    border-radius:10px;
}

.download-line{
    background:#e00000;
}

.upload-line{
    background:#0b9b54;
}


/* =========================
   GRAPH
========================= */

.graph-container{
    width:100%;

    height:190px;

    position:relative;

    border-radius:10px;

    background:var(--bg);

    overflow:hidden;
}

#speedCanvas{
    width:100%;
    height:100%;

    display:block;
}

.speed-note{
    text-align:center;

    font-size:11px;

    color:var(--muted);

    margin-top:9px;
}


/* =========================
   INFO
========================= */

.info,
.billing,
.bill,
.address,
.connection{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:12px;
}

.info-title{
    font-size:12px;

    color:var(--muted);

    font-weight:bold;

    margin-bottom:7px;
}

.info-value{
    font-size:17px;

    font-weight:bold;

    line-height:1.4;

    color:var(--text);
}

.bill-value{
    font-size:22px;

    font-weight:bold;

    color:var(--green);
}


/* =========================
   ONLINE
========================= */

.online{
    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:7px 11px;

    background:#e8f7ef;

    color:#08783d;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;
}

.online-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#0aa854;

    box-shadow:
        0 0 6px #0aa854;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .header{
        height:60px;
        padding:0 14px;
    }

    .title{
        font-size:18px;
    }

    .logout{
        padding:9px 13px;
    }

    .container{
        padding:18px 13px 30px;
    }

    .photo{
        width:200px;
        height:200px;
    }

    .value{
        font-size:14px;
    }

    .mac-value{
        font-size:15px;
    }

    .info-value{
        font-size:15px;
    }

    .speed-value{
        font-size:20px;
    }

}

</style>

<script>

/* =====================================================
   LOGIN
===================================================== */

if(
    sessionStorage.getItem("loggedIn")
    !== "true"
){

    window.location.replace("index.html");

}


/* =====================================================
   USERNAME
===================================================== */

const savedUsername =
sessionStorage.getItem("username");

if(savedUsername){

    document.getElementById(
        "username"
    ).textContent =
        savedUsername;

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    sessionStorage.removeItem("loggedIn");

    sessionStorage.removeItem("username");

    window.location.replace("index.html");

}


/* =====================================================
   THEME
===================================================== */

const themeButton =
document.getElementById("themeButton");


function loadTheme(){

    const theme =
    localStorage.getItem("customerTheme");


    if(theme === "dark"){

        document.body.classList.add("dark");

        themeButton.textContent = "☀";

    }

}


function toggleTheme(){

    document.body.classList.toggle("dark");


    const dark =
    document.body.classList.contains("dark");


    localStorage.setItem(
        "customerTheme",
        dark ? "dark" : "light"
    );


    themeButton.textContent =
        dark ? "☀" : "☾";


    drawGraph();

}


loadTheme();


/* =====================================================
   SPEED MANAGE
===================================================== */

const speedBox =
document.getElementById("speedBox");

const manageButton =
document.getElementById("manageButton");


function toggleSpeed(){

    speedBox.classList.toggle("minimized");


    const minimized =
    speedBox.classList.contains("minimized");


    manageButton.textContent =
        minimized ? "+" : "−";


    localStorage.setItem(
        "speedMinimized",
        minimized ? "true" : "false"
    );


}


if(
    localStorage.getItem("speedMinimized")
    === "true"
){

    speedBox.classList.add("minimized");

    manageButton.textContent = "+";

}


/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("speedCanvas");

const ctx =
canvas.getContext("2d");


const downloadSpeed =
document.getElementById("downloadSpeed");

const uploadSpeed =
document.getElementById("uploadSpeed");

const downloadUnit =
document.getElementById("downloadUnit");

const uploadUnit =
document.getElementById("uploadUnit");


let downloadHistory = [];

let uploadHistory = [];

const MAX_POINTS = 60;


/* =====================================================
   RESOURCE TRAFFIC MONITOR
===================================================== */

let lastTotalBytes = 0;

let lastMeasureTime =
performance.now();


/*
   Resource list-এর সর্বশেষ
   transferSize যোগ করা হবে।
*/

function getTotalPageBytes(){

    let total = 0;

    try{

        const resources =
        performance.getEntriesByType(
            "resource"
        );


        for(
            let i = 0;
            i < resources.length;
            i++
        ){

            const r =
            resources[i];


            if(
                typeof r.transferSize
                === "number"
            ){

                total +=
                r.transferSize;

            }

        }

    }
    catch(e){

        total = 0;

    }


    return total;

}


/* =====================================================
   DOWNLOAD
===================================================== */

function measureDownload(){

    const now =
    performance.now();


    const totalBytes =
    getTotalPageBytes();


    const elapsed =
    (
        now -
        lastMeasureTime
    ) / 1000;


    let bytesPerSecond = 0;


    if(
        elapsed > 0
    ){

        const difference =
        totalBytes -
        lastTotalBytes;


        if(difference > 0){

            bytesPerSecond =
            difference /
            elapsed;

        }

    }


    lastTotalBytes =
    totalBytes;

    lastMeasureTime =
    now;


    return (
        bytesPerSecond *
        8 /
        1024 /
        1024
    );

}


/* =====================================================
   DISPLAY
===================================================== */

function showSpeed(
    element,
    unitElement,
    mbps
){

    if(
        !isFinite(mbps) ||
        mbps <= 0
    ){

        element.textContent =
        "00";

        unitElement.textContent =
        "KBPS";

        return;

    }


    const kbps =
    mbps * 1024;


    if(
        kbps < 1024
    ){

        element.textContent =
        kbps < 10
        ? kbps.toFixed(1)
        : Math.round(kbps);

        unitElement.textContent =
        "KBPS";

    }
    else{

        element.textContent =
        mbps.toFixed(2);

        unitElement.textContent =
        "MBPS";

    }

}


/* =====================================================
   UPDATE
===================================================== */

function updateSpeed(){

    const download =
    measureDownload();


    /*
       Browser security-এর কারণে
       page-এর complete upload traffic
       read করা যায় না।

       তাই fake upload value ব্যবহার
       করা হচ্ছে না।
    */

    const upload = 0;


    showSpeed(
        downloadSpeed,
        downloadUnit,
        download
    );


    showSpeed(
        uploadSpeed,
        uploadUnit,
        upload
    );


    downloadHistory.push(
        download
    );


    uploadHistory.push(
        upload
    );


    if(
        downloadHistory.length >
        MAX_POINTS
    ){

        downloadHistory.shift();

    }


    if(
        uploadHistory.length >
        MAX_POINTS
    ){

        uploadHistory.shift();

    }


    drawGraph();

}


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas(){

    const rect =
    canvas.parentElement
    .getBoundingClientRect();


    const ratio =
    window.devicePixelRatio || 1;


    canvas.width =
    Math.floor(
        rect.width * ratio
    );


    canvas.height =
    Math.floor(
        rect.height * ratio
    );


    canvas.style.width =
    rect.width + "px";


    canvas.style.height =
    rect.height + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   GRAPH
===================================================== */

function drawGraph(){

    const width =
    canvas.clientWidth;


    const height =
    canvas.clientHeight;


    if(
        width <= 0 ||
        height <= 0
    ){

        return;

    }


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const dark =
    document.body.classList.contains(
        "dark"
    );


    /* GRID */

    ctx.strokeStyle =
    dark
    ? "#292929"
    : "#e4e9e6";


    ctx.lineWidth = 1;


    for(
        let i = 1;
        i < 5;
        i++
    ){

        const y =
        (
            height / 5
        ) * i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    const combined =
    downloadHistory.concat(
        uploadHistory
    );


    if(
        combined.length < 2
    ){

        return;

    }


    let max =
    Math.max(
        ...combined,
        0.001
    );


    max *= 1.25;


    drawLine(
        downloadHistory,
        "#e00000",
        width,
        height,
        max
    );


    drawLine(
        uploadHistory,
        "#0b9b54",
        width,
        height,
        max
    );

}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(
    data,
    color,
    width,
    height,
    max
){

    if(
        data.length < 2
    ){

        return;

    }


    ctx.beginPath();


    for(
        let i = 0;
        i < data.length;
        i++
    ){

        const x =
        (
            i /
            (data.length - 1)
        ) * width;


        const value =
        Number(data[i]) || 0;


        const y =
        height -
        (
            value /
            max
        ) *
        (
            height - 15
        ) -
        7;


        if(i === 0){

            ctx.moveTo(
                x,
                y
            );

        }
        else{

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.strokeStyle =
    color;

    ctx.lineWidth = 3;

    ctx.lineJoin =
    "round";

    ctx.lineCap =
    "round";


    ctx.stroke();


    /* LAST POINT */

    const last =
    data.length - 1;


    const lastX =
    (
        last /
        (data.length - 1)
    ) * width;


    const lastValue =
    Number(
        data[last]
    ) || 0;


    const lastY =
    height -
    (
        lastValue /
        max
    ) *
    (
        height - 15
    ) -
    7;


    ctx.beginPath();

    ctx.arc(
        lastX,
        lastY,
        4,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
    color;

    ctx.fill();

}


/* =====================================================
   START
===================================================== */

resizeCanvas();

updateSpeed();


/*
   100 milliseconds
   = 0.1 second
*/

setInterval(
    updateSpeed,
    100
);

</script>


</body>
