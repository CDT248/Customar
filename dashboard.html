<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#222;
    --muted:#777;
    --border:#dddddd;
    --green:#0b5d3b;
}

body.dark{
    --bg:#000000;
    --card:#111111;
    --text:#ffffff;
    --muted:#aaaaaa;
    --border:#292929;
    --green:#19a866;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    transition:.25s;
}


/* =========================
   THEME BUTTON
========================= */

.theme-button{
    position:fixed;
    top:5px;
    right:5px;

    width:25px;
    height:25px;

    border:1px solid var(--border);
    border-radius:50%;

    background:var(--card);
    color:var(--text);

    font-size:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:9999;
}


/* =========================
   HEADER
========================= */

.header{
    height:65px;

    background:var(--card);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    border-bottom:1px solid var(--border);

    position:sticky;
    top:0;
    z-index:100;
}

.title{
    font-size:20px;
    font-weight:bold;
    color:var(--green);
}

.logout{
    border:0;
    background:var(--green);
    color:white;

    padding:10px 17px;

    border-radius:8px;

    font-size:14px;
    font-weight:bold;

    cursor:pointer;
}


/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:650px;

    margin:auto;

    padding:22px 16px 40px;
}


/* =========================
   USERNAME PASSWORD
========================= */

.top{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:12px;
}

.box{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;
}

.label{
    font-size:12px;
    font-weight:bold;
    color:var(--muted);

    margin-bottom:7px;
}

.value{
    font-size:16px;
    font-weight:bold;
    color:var(--text);
}


/* =========================
   MAC
========================= */

.mac-box{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:18px;
}

.mac-title{
    font-size:12px;

    color:var(--muted);

    font-weight:bold;

    margin-bottom:7px;
}

.mac-value{
    font-size:17px;

    font-weight:bold;

    color:var(--text);

    word-break:break-all;
}


/* =========================
   PHOTO
========================= */

.photo-box{
    width:100%;

    display:flex;

    justify-content:center;

    margin:5px 0 22px;
}

.photo{
    width:220px;
    height:220px;

    border-radius:50%;

    overflow:hidden;

    background:#dff0e8;

    border:6px solid var(--card);

    box-shadow:
        0 7px 28px rgba(0,0,0,.18);
}

.photo svg{
    width:100%;
    height:100%;
    display:block;
}


/* =========================
   SPEED BOX
========================= */

.speed-box{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:14px;

    padding:18px;

    margin-bottom:14px;
}

.speed-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;
}

.speed-title{
    font-size:14px;

    font-weight:bold;

    color:var(--muted);
}

.speed-live{
    font-size:11px;

    font-weight:bold;

    color:#08783d;

    background:#e8f7ef;

    padding:5px 9px;

    border-radius:6px;
}


/* =========================
   SPEED VALUES
========================= */

.speed-values{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:18px;
}

.speed-value-box{
    border:1px solid var(--border);

    border-radius:10px;

    padding:12px;

    background:var(--bg);
}

.speed-value-title{
    font-size:11px;

    font-weight:bold;

    margin-bottom:5px;
}

.download-title{
    color:#e00000;
}

.upload-title{
    color:#0b9b54;
}

.speed-value{
    font-size:24px;

    font-weight:bold;

    color:var(--text);
}

.speed-unit{
    font-size:11px;

    color:var(--muted);

    font-weight:bold;
}


/* =========================
   GRAPH LEGEND
========================= */

.graph-legend{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:25px;

    margin-bottom:10px;
}

.legend{
    display:flex;

    align-items:center;

    gap:6px;

    font-size:12px;

    font-weight:bold;

    color:var(--text);
}

.legend-line{
    width:25px;

    height:3px;

    border-radius:10px;
}

.download-line{
    background:#e00000;
}

.upload-line{
    background:#0b9b54;
}


/* =========================
   GRAPH
========================= */

.graph-container{
    width:100%;

    height:190px;

    position:relative;

    border-radius:10px;

    background:var(--bg);

    overflow:hidden;
}

#speedCanvas{
    width:100%;
    height:100%;

    display:block;
}

.speed-note{
    text-align:center;

    font-size:11px;

    color:var(--muted);

    margin-top:9px;
}


/* =========================
   INFO
========================= */

.info,
.billing,
.bill,
.address,
.connection{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:12px;
}

.info-title{
    font-size:12px;

    color:var(--muted);

    font-weight:bold;

    margin-bottom:7px;
}

.info-value{
    font-size:17px;

    font-weight:bold;

    line-height:1.4;

    color:var(--text);
}

.bill-value{
    font-size:22px;

    font-weight:bold;

    color:var(--green);
}


/* =========================
   ONLINE
========================= */

.online{
    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:7px 11px;

    background:#e8f7ef;

    color:#08783d;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;
}

.online-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#0aa854;

    box-shadow:
        0 0 6px #0aa854;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .header{
        height:60px;

        padding:0 14px;
    }

    .title{
        font-size:18px;
    }

    .logout{
        padding:9px 13px;
    }

    .container{
        padding:18px 13px 30px;
    }

    .photo{
        width:200px;
        height:200px;
    }

    .value{
        font-size:14px;
    }

    .mac-value{
        font-size:15px;
    }

    .info-value{
        font-size:15px;
    }

    .speed-value{
        font-size:20px;
    }

}

</style>

</head>


<body>

<script>


/* =====================================================
   LOGIN
===================================================== */

if(
    sessionStorage.getItem("loggedIn")
    !== "true"
){

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   USERNAME
===================================================== */

const savedUsername =
sessionStorage.getItem("username");

if(savedUsername){

    document.getElementById(
        "username"
    ).textContent =
        savedUsername;

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    sessionStorage.removeItem(
        "loggedIn"
    );

    sessionStorage.removeItem(
        "username"
    );

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   THEME
===================================================== */

const themeButton =
document.getElementById(
    "themeButton"
);


function loadTheme(){

    const theme =
    localStorage.getItem(
        "customerTheme"
    );


    if(theme === "dark"){

        document.body.classList.add(
            "dark"
        );

        themeButton.textContent =
            "☀";

    }

}


function toggleTheme(){

    document.body.classList.toggle(
        "dark"
    );


    const dark =
    document.body.classList.contains(
        "dark"
    );


    localStorage.setItem(
        "customerTheme",
        dark
        ? "dark"
        : "light"
    );


    themeButton.textContent =
        dark
        ? "☀"
        : "☾";


    drawGraph();

}


loadTheme();


/* =====================================================
   GRAPH
===================================================== */

const canvas =
document.getElementById(
    "speedCanvas"
);

const ctx =
canvas.getContext("2d");


const downloadSpeed =
document.getElementById(
    "downloadSpeed"
);

const uploadSpeed =
document.getElementById(
    "uploadSpeed"
);

const downloadUnit =
document.getElementById(
    "downloadUnit"
);

const uploadUnit =
document.getElementById(
    "uploadUnit"
);


let downloadHistory = [];

let uploadHistory = [];

const MAX_POINTS = 60;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    const rect =
    canvas.parentElement
    .getBoundingClientRect();

    const ratio =
    window.devicePixelRatio || 1;


    canvas.width =
    rect.width * ratio;

    canvas.height =
    rect.height * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   FORMAT
===================================================== */

function formatSpeed(bytes){

    if(
        !bytes ||
        bytes <= 0
    ){

        return {
            value:"00",
            unit:"KBPS"
        };

    }


    const kb =
    bytes / 1024;


    if(kb < 1024){

        return {

            value:
                kb < 10
                ? kb.toFixed(1)
                : Math.round(kb),

            unit:"KBPS"

        };

    }


    return {

        value:
            (kb / 1024).toFixed(1),

        unit:"MBPS"

    };

}


/* =====================================================
   AUTOMATIC PAGE NETWORK MONITOR
===================================================== */

let previousBytes = 0;

let previousTime =
performance.now();


function measureNetwork(){

    const now =
    performance.now();


    const seconds =
    (now - previousTime) /
    1000;


    let totalBytes = 0;


    try{

        const resources =
        performance.getEntriesByType(
            "resource"
        );


        resources.forEach(
            resource=>{

                if(
                    resource.transferSize
                ){

                    totalBytes +=
                    resource.transferSize;

                }

            }
        );

    }
    catch(error){

        totalBytes = 0;

    }


    let bytesPerSecond = 0;


    if(seconds > 0){

        bytesPerSecond =
            Math.max(
                0,
                (
                    totalBytes -
                    previousBytes
                ) / seconds
            );

    }


    previousBytes =
    totalBytes;

    previousTime =
    now;


    /*
       Browser does not expose
       total phone upload traffic.
    */

    const download =
    formatSpeed(
        bytesPerSecond
    );


    const upload =
    formatSpeed(0);


    downloadSpeed.textContent =
    download.value;

    downloadUnit.textContent =
    download.unit;


    uploadSpeed.textContent =
    upload.value;

    uploadUnit.textContent =
    upload.unit;


    /*
       Store Mbps for graph.
    */

    downloadHistory.push(
        bytesPerSecond /
        1024 /
        1024
    );


    uploadHistory.push(
        0
    );


    if(
        downloadHistory.length >
        MAX_POINTS
    ){

        downloadHistory.shift();

    }


    if(
        uploadHistory.length >
        MAX_POINTS
    ){

        uploadHistory.shift();

    }


    drawGraph();

}


/* =====================================================
   DRAW GRAPH
===================================================== */

function drawGraph(){

    const width =
    canvas.parentElement.clientWidth;

    const height =
    canvas.parentElement.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const dark =
    document.body.classList.contains(
        "dark"
    );


    ctx.strokeStyle =
    dark
    ? "#292929"
    : "#e5e9e6";


    ctx.lineWidth = 1;


    for(
        let i=1;
        i<5;
        i++
    ){

        const y =
        (height/5)*i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    const all =
    downloadHistory.concat(
        uploadHistory
    );


    if(all.length === 0){

        return;

    }


    let max =
    Math.max(
        ...all,
        0.01
    );


    max *= 1.2;


    drawLine(
        downloadHistory,
        "#e00000",
        width,
        height,
        max
    );


    drawLine(
        uploadHistory,
        "#0b9b54",
        width,
        height,
        max
    );

}


/* =====================================================
   LINE
===================================================== */

function drawLine(
    data,
    color,
    width,
    height,
    max
){

    if(data.length === 0){

        return;

    }


    ctx.beginPath();


    data.forEach(
        (value,index)=>{

            const x =
            data.length === 1
            ? width / 2
            :
            (
                index /
                (
                    data.length - 1
                )
            ) * width;


            const y =
            height -
            (
                value / max
            ) *
            (
                height - 15
            ) -
            7;


            if(index === 0){

                ctx.moveTo(
                    x,
                    y
                );

            }
            else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
    color;

    ctx.lineWidth = 3;

    ctx.lineJoin =
    "round";

    ctx.lineCap =
    "round";


    ctx.stroke();

}


/* =====================================================
   START
===================================================== */

resizeCanvas();


/*
   0.1 second update
*/

setInterval(
    measureNetwork,
    100
);

</script>
