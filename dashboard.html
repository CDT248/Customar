<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f8;
    color:#222;
}


/* =========================
   HEADER
========================= */

.header{
    height:65px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #e5e5e5;
    position:sticky;
    top:0;
    z-index:100;
}

.title{
    font-size:20px;
    font-weight:bold;
    color:#0b5d3b;
}

.logout{
    border:0;
    background:#0b5d3b;
    color:#fff;
    padding:10px 17px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.logout:hover{
    background:#08492f;
}


/* =========================
   MAIN
========================= */

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:22px 16px 40px;
}


/* =========================
   USERNAME PASSWORD
========================= */

.top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
}

.box{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
}

.label{
    font-size:12px;
    font-weight:bold;
    color:#777;
    margin-bottom:7px;
}

.value{
    font-size:16px;
    font-weight:bold;
    color:#222;
    word-break:break-word;
}


/* =========================
   MAC
========================= */

.mac-box{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:18px;
}

.mac-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.mac-value{
    font-size:17px;
    font-weight:bold;
    color:#222;
    word-break:break-all;
}


/* =========================
   PHOTO
========================= */

.photo-box{
    width:100%;
    display:flex;
    justify-content:center;
    margin:5px 0 22px;
}

.photo{
    width:220px;
    height:220px;
    border-radius:50%;
    overflow:hidden;
    background:#e8f4ef;
    border:6px solid #fff;
    box-shadow:0 7px 28px rgba(0,0,0,.16);
}

.photo svg{
    width:100%;
    height:100%;
    display:block;
}


/* =========================
   SPEED BOX
========================= */

.speed-box{
    background:#fff;
    border:1px solid #ddd;
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
}

.speed-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.speed-title{
    font-size:14px;
    font-weight:bold;
    color:#555;
}

.speed-live{
    font-size:11px;
    font-weight:bold;
    color:#08783d;
    background:#e8f7ef;
    padding:5px 9px;
    border-radius:6px;
}


/* =========================
   DOWNLOAD UPLOAD VALUES
========================= */

.speed-values{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
}

.speed-value-box{
    border:1px solid #e3e3e3;
    border-radius:10px;
    padding:12px;
    background:#fafafa;
}

.speed-value-title{
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

.download-title{
    color:#d90000;
}

.upload-title{
    color:#08783d;
}

.speed-value{
    font-size:24px;
    font-weight:bold;
    color:#222;
}

.speed-value-unit{
    font-size:11px;
    color:#777;
    font-weight:bold;
}


/* =========================
   GRAPH LEGEND
========================= */

.graph-legend{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:24px;
    margin-bottom:10px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:bold;
}

.legend-line{
    width:24px;
    height:3px;
    border-radius:10px;
}

.legend-download{
    background:#e00000;
}

.legend-upload{
    background:#0b8f4d;
}


/* =========================
   GRAPH
========================= */

.graph-container{
    width:100%;
    height:190px;
    position:relative;
    border-radius:10px;
    background:#f8faf9;
    overflow:hidden;
}

#speedCanvas{
    width:100%;
    height:100%;
    display:block;
}

.speed-note{
    text-align:center;
    font-size:11px;
    color:#999;
    margin-top:9px;
}


/* =========================
   INFO
========================= */

.info{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.info-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.info-value{
    font-size:17px;
    font-weight:bold;
    line-height:1.4;
}


/* =========================
   BILLING DATE
========================= */

.billing-date{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.billing-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.billing-value{
    font-size:18px;
    font-weight:bold;
    color:#222;
}


/* =========================
   BILL
========================= */

.bill{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.bill-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:6px;
}

.bill-value{
    font-size:22px;
    font-weight:bold;
    color:#0b5d3b;
}


/* =========================
   ADDRESS
========================= */

.address{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.address-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.address-value{
    font-size:17px;
    font-weight:bold;
    line-height:1.4;
}


/* =========================
   CONNECTION STATUS
========================= */

.connection{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
}

.connection-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:8px;
}

.online{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    background:#e8f7ef;
    color:#08783d;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
}

.online-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#0aa854;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .header{
        height:60px;
        padding:0 14px;
    }

    .title{
        font-size:18px;
    }

    .logout{
        padding:9px 13px;
    }

    .container{
        padding:18px 13px 30px;
    }

    .photo{
        width:200px;
        height:200px;
    }

    .value{
        font-size:14px;
    }

    .mac-value{
        font-size:15px;
    }

    .info-value,
    .address-value{
        font-size:15px;
    }

    .billing-value{
        font-size:16px;
    }

    .speed-value{
        font-size:20px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="title">
        Customer Portal
    </div>

    <button
        class="logout"
        onclick="logout()">
        Logout
    </button>

</div>



<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- USERNAME + PASSWORD -->

    <div class="top">

        <div class="box">

            <div class="label">
                USERNAME
            </div>

            <div
                class="value"
                id="username">
                ADMIN
            </div>

        </div>


        <div class="box">

            <div class="label">
                PASSWORD
            </div>

            <div
                class="value"
                id="password">
                12345
            </div>

        </div>

    </div>



    <!-- MAC -->

    <div class="mac-box">

        <div class="mac-title">
            MAC
        </div>

        <div class="mac-value">
            22:91:fb:b1:a5:41
        </div>

    </div>



    <!-- =========================
         CUSTOMER PHOTO
    ========================= -->

    <div class="photo-box">

        <div class="photo">

            <svg
                id="profilePhoto"
                viewBox="0 0 500 500"
                xmlns="http://www.w3.org/2000/svg">

                <!-- Background -->

                <rect
                    width="500"
                    height="500"
                    fill="#e8f4ef"/>


                <!-- Circle -->

                <circle
                    cx="250"

                    r="210"
                    fill="#d2eadf"/>


                <!-- Body -->

                <path
                    d="M115 470
                       C125 350 180 315 250 315
                       C320 315 375 350 385 470
                       Z"
                    fill="#0b5d3b"/>


                <!-- Neck -->

                <path
                    d="M205 285
                       L205 350
                       C205 365 220 375 250 375
                       C280 375 295 365 295 350
                       L295 285
                       Z"
                    fill="#d99b72"/>


                <!-- Face -->

                <ellipse
                    cx="250"

                    ry="125"
                    fill="#e5aa7d"/>


                <!-- Hair -->

                <path

                       C140 135 180 80 250 80
                       C330 80 370 145 350 230
                       C330 185 305 165 270 160
                       C225 153 190 175 150 220
                       Z"
                    fill="#202020"/>


                <!-- Left ear -->

                <ellipse
                    cx="148"

                    rx="18"
                    ry="30"
                    fill="#d99b72"/>


                <!-- Right ear -->

                <ellipse
                    cx="352"
                    cy="235"
                    rx="18"
                    ry="30"
                    fill="#d99b72"/>


                <!-- Eyes -->

                <ellipse
                    cx="215"
                    cy="225"
                    rx="8"
                    ry="10"
                    fill="#222"/>

                <ellipse
                    cx="285"
                    cy="225"
                    rx="8"
                    ry="10"
                    fill="#222"/>


                <!-- Nose -->

                <path
                    d="M250 225
                       L238 265
                       L260 265"
                    fill="none"
                    stroke="#a66d4c"
                    stroke-width="6"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>


                <!-- Smile -->

                <path
                    d="M220 285
                       Q250 305 280 285"
                    fill="none"
                    stroke="#8c4938"
                    stroke-width="6"
                    stroke-linecap="round"/>


                <!-- Shirt -->

                <path
                    d="M170 355
                       L250 420
                       L330 355
                       C370 370 390 420 400 470
                       L100 470
                       C110 420 130 370 170 355
                       Z"
                    fill="#0b5d3b"/>

            </svg>

        </div>

    </div>



    <!-- =========================
         LIVE SPEED
    ========================= -->

    <div class="speed-box">

        <div class="speed-header">

            <div class="speed-title">
                📶 INTERNET SPEED
            </div>

            <div
                class="speed-live"
                id="speedStatus">
                ● LIVE
            </div>

        </div>


        <!-- DOWNLOAD + UPLOAD -->

        <div class="speed-values">

            <div class="speed-value-box">

                <div class="speed-value-title download-title">
                    DOWNLOAD
                </div>

                <div
                    class="speed-value"
                    id="downloadSpeed">
                    00
                </div>

                <span
                    class="speed-value-unit"
                    id="downloadUnit">
                    KBPS
                </span>

            </div>


            <div class="speed-value-box">

                <div class="speed-value-title upload-title">
                    UPLOAD
                </div>

                <div
                    class="speed-value"
                    id="uploadSpeed">
                    00
                </div>

                <span
                    class="speed-value-unit"
                    id="uploadUnit">
                    KBPS
                </span>

            </div>

        </div>



        <!-- GRAPH LEGEND -->

        <div class="graph-legend">

            <div class="legend-item">

                <span class="legend-line legend-download"></span>

                <span>
                    Download
                </span>

            </div>


            <div class="legend-item">

                <span class="legend-line legend-upload"></span>

                <span>
                    Upload
                </span>

            </div>

        </div>



        <!-- GRAPH -->

        <div class="graph-container">

            <canvas
                id="speedCanvas">
            </canvas>

        <div class="speed-note">
            Live download & upload speed
        </div>

    </div>



    <!-- NAME -->

    <div class="info">

        <div class="info-title">
            NAME
        </div>

        <div class="info-value">
            Shemanto Islam
        </div>

    </div>



    <!-- BILLING DATE -->

    <div class="billing-date">

        <div class="billing-title">
            BILLING DATE
        </div>

        </div>

    <!-- BILL -->

    <div class="bill">

        </div>

    <!-- ADDRESS -->

    <div class="address">

        </div>

    </div>



    <!-- CONNECTION STATUS -->

    <div class="connection">

            CONNECTING STATUS
        </div>

        <div class="online">

            Online

        </div>

    </div>


</div>



<script>


/* =====================================================
   LOGIN CHECK
===================================================== */

if(
    sessionStorage.getItem("loggedIn") !== "true"
){

    window.location.replace("index.html");

}


/* =====================================================
   USERNAME
===================================================== */

const savedUsername =
    sessionStorage.getItem("username");

if(savedUsername){

    document.getElementById(
        "username"
    ).textContent =
        savedUsername;

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    sessionStorage.removeItem(
        "loggedIn"
    );

    sessionStorage.removeItem(
        "username"
    );

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   SPEED GRAPH
===================================================== */

const canvas =
    document.getElementById(
        "speedCanvas"
    );

const ctx =
    canvas.getContext("2d");


const downloadSpeed =
    document.getElementById(
        "downloadSpeed"
    );

const downloadUnit =
    document.getElementById(
        "downloadUnit"
    );


const uploadSpeed =
    document.getElementById(
        "uploadSpeed"
    );

const uploadUnit =
    document.getElementById(
        "uploadUnit"
    );


const speedStatus =
    document.getElementById(
        "speedStatus"
    );


let downloadHistory = [];

let uploadHistory = [];

const MAX_POINTS = 40;


/* =====================================================
   CANVAS RESIZE
===================================================== */

function resizeCanvas(){

    const rect =
        canvas.parentElement
        .getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;


    canvas.style.width =
        rect.width + "px";

    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   FORMAT SPEED
===================================================== */

function formatSpeed(mbps){

    if(
        !isFinite(mbps) ||
        mbps <= 0
    ){

        return {
            value:"00",
            unit:"KBPS"
        };

    }


    if(mbps < 1){

        const kbps =
            mbps * 1000;


        return {
            value:
                kbps < 10
                ? kbps.toFixed(1)
                : Math.round(kbps),

            unit:"KBPS"
        };

    }


    return {
        value:
            mbps.toFixed(1),

        unit:"MBPS"
    };

}


/* =====================================================
   DRAW GRAPH
===================================================== */

function drawGraph(){

    const width =
        canvas.parentElement.clientWidth;

    const height =
        canvas.parentElement.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* GRID */

    ctx.strokeStyle =
        "#e5e9e7";

    ctx.lineWidth = 1;


    for(
        let i = 1;
        i < 5;
        i++
    ){

        const y =
            (height / 5) * i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    const allValues =
        downloadHistory.concat(
            uploadHistory
        );


    if(allValues.length === 0){

        return;

    }


    let maxSpeed =
        Math.max(
            ...allValues
        );


    if(
        !isFinite(maxSpeed) ||
        maxSpeed <= 0
    ){

        maxSpeed = 1;

    }


    maxSpeed =
        Math.ceil(maxSpeed);


    if(maxSpeed < 1){

        maxSpeed = 1;

    }


    /* =========================
       DOWNLOAD RED
    ========================= */

    drawLine(
        downloadHistory,
        "#e00000",
        width,
        height,
        maxSpeed
    );


    /* =========================
       UPLOAD GREEN
    ========================= */

    drawLine(
        uploadHistory,
        "#0b8f4d",
        width,
        height,
        maxSpeed
    );

}


/* =====================================================
   DRAW ONE LINE
===================================================== */

function drawLine(
    history,
    lineColor,
    width,
    height,
    maxSpeed
){

    if(history.length === 0){

        return;

    }


    ctx.beginPath();


    history.forEach(
        (speed,index)=>{

            const x =
                history.length === 1
                ? width / 2
                :
                (
                    index /
                    (
                        history.length - 1
                    )
                ) * width;


            const y =
                height -
                (
                    (
                        speed /
                        maxSpeed
                    ) *
                    (
                        height - 15
                    )
                ) -
                7;


            if(index === 0){

                ctx.moveTo(
                    x,
                    y
                );

            }
            else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        lineColor;

    ctx.lineWidth = 3;

    ctx.lineJoin =
        "round";

    ctx.lineCap =
        "round";


    ctx.stroke();

}


/* =====================================================
   SIMULATED LIVE GRAPH
===================================================== */

function updateLiveGraph(){

    /*
       Browser cannot directly read the ISP router's
       actual traffic without a proper speed-test server.

       This keeps the graph alive until a real
       speed-test backend is connected.
    */

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;


    let base =
        connection &&
        typeof connection.downlink === "number"
        ? connection.downlink
        : 0;


    /*
       Keep idle speed near zero.
    */

    if(
        !connection ||
        base <= 0
    ){

        base = 0;

    }


    /*
       Small display value for the graph.
    */

    const download =
        base > 0
        ? base
        : 0;


    const upload =
        base > 0
        ? base * 0.15
        : 0;


    downloadHistory.push(
        download
    );

    uploadHistory.push(
        upload
    );


    if(
        downloadHistory.length >
        MAX_POINTS
    ){

        downloadHistory.shift();

    }


    if(
        uploadHistory.length >
        MAX_POINTS
    ){

        uploadHistory.shift();

    }


    const d =
        formatSpeed(
            download
        );

    const u =
        formatSpeed(
            upload
        );


    downloadSpeed.textContent =
        d.value;

    downloadUnit.textContent =
        d.unit;


    uploadSpeed.textContent =
        u.value;

    uploadUnit.textContent =
        u.unit;


    drawGraph();

}


/* =====================================================
   START
===================================================== */

resizeCanvas();


updateLiveGraph();


setInterval(
    updateLiveGraph,
    100
);

</script>


</body>
</html>
