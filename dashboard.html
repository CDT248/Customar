<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f8;
    color:#222;
}


/* ================= HEADER ================= */

.header{
    height:65px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #e5e5e5;
    position:sticky;
    top:0;
    z-index:100;
}

.title{
    font-size:20px;
    font-weight:bold;
    color:#0b5d3b;
}

.logout{
    border:0;
    background:#0b5d3b;
    color:#fff;
    padding:10px 17px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}


/* ================= MAIN ================= */

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:22px 16px 40px;
}


/* ================= TOP USER ================= */

.top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:14px;
}

.box{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
}

.label{
    font-size:12px;
    font-weight:bold;
    color:#777;
    margin-bottom:7px;
}

.value{
    font-size:16px;
    font-weight:bold;
    color:#222;
    word-break:break-word;
}


/* ================= PHOTO ================= */

.photo-box{
    width:100%;
    display:flex;
    justify-content:center;
    margin:18px 0 22px;
}

.photo{
    width:220px;
    height:220px;
    border-radius:50%;
    overflow:hidden;
    background:#ddd;
    border:6px solid #fff;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* ================= INFO ================= */

.info{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.info-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.info-value{
    font-size:17px;
    font-weight:bold;
    line-height:1.4;
}


/* ================= BILL ================= */

.bill{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.bill-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:6px;
}

.bill-value{
    font-size:22px;
    font-weight:bold;
    color:#0b5d3b;
}


/* ================= WIFI ================= */

.wifi{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
}

.wifi-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.wifi-value{
    font-size:17px;
    font-weight:bold;
}

.status{
    display:inline-block;
    margin-top:7px;
    padding:5px 9px;
    background:#e8f7ef;
    color:#08783d;
    border-radius:6px;
    font-size:11px;
    font-weight:bold;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    .header{
        height:60px;
        padding:0 14px;
    }

    .title{
        font-size:18px;
    }

    .logout{
        padding:9px 13px;
    }

    .container{
        padding:18px 13px 30px;
    }

    .photo{
        width:200px;
        height:200px;
    }

    .value{
        font-size:14px;
    }

    .info-value{
        font-size:15px;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div class="header">

    <div class="title">
        User Dashboard
    </div>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</div>



<!-- ================= CONTENT ================= -->

<div class="container">


    <!-- USERNAME + PASSWORD -->

    <div class="top">

        <div class="box">

            <div class="label">
                USERNAME
            </div>

            <div class="value" id="username">
                ADMIN
            </div>

        </div>


        <div class="box">

            <div class="label">
                PASSWORD
            </div>

            <div class="value" id="password">
                12345
            </div>

        </div>

    </div>



    <!-- PHOTO -->

    <div class="photo-box">

        <div class="photo">

            <img
                src="https://via.placeholder.com/500"
                alt="Profile Photo"
            >

        </div>

    </div>



    <!-- MAC -->

    <div class="info">

        <div class="info-title">
            MAC
        </div>

        <div class="info-value">
            22:91:fb:b1:a5:41
        </div>

    </div>



    <!-- NAME -->

    <div class="info">

        <div class="info-title">
            NAME
        </div>

        <div class="info-value">
            Shemanto Islam
        </div>

    </div>



    <!-- ADDRESS -->

    <div class="info">

        <div class="info-title">
            ADDRESS
        </div>

        <div class="info-value">
            sagorika road pahartali Chittagong
        </div>

    </div>



    <!-- BILL -->

    <div class="bill">

        <div class="bill-title">
            BILL
        </div>

        <div class="bill-value">
            500 tk
        </div>

    </div>



    <!-- OPERATOR / WIFI -->

    <div class="wifi">

        <div class="wifi-title">
            OPERATOR / CONNECTED WIFI
        </div>

        <div class="wifi-value" id="wifiName">
            Connected WiFi
        </div>

        <div class="status">
            ● Connected
        </div>

    </div>


</div>



<script>


/* ================= LOGIN CHECK ================= */

if(sessionStorage.getItem("loggedIn") !== "true"){

    window.location.replace("index.html");

}


/* ================= USERNAME ================= */

const username =
    sessionStorage.getItem("username");

if(username){

    document.getElementById("username")
    .textContent = username;

}


/* ================= LOGOUT ================= */

function logout(){

    sessionStorage.removeItem("loggedIn");
    sessionStorage.removeItem("username");

    window.location.replace("index.html");

}

</script>


</body>
</html>
