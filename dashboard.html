<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#222;
    --muted:#777;
    --border:#dddddd;
    --green:#0b5d3b;
}

body.dark{
    --bg:#000000;
    --card:#111111;
    --text:#ffffff;
    --muted:#aaaaaa;
    --border:#292929;
    --green:#19a866;
}

body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    transition:.3s;
}


/* =========================
   THEME BUTTON
========================= */

.theme-button{
    position:fixed;

    top:5px;
    right:5px;

    width:25px;
    height:25px;

    border:1px solid var(--border);

    border-radius:50%;

    background:var(--card);

    color:var(--text);

    font-size:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:9999;
}


/* =========================
   HEADER
========================= */

.header{
    height:65px;

    background:var(--card);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    border-bottom:1px solid var(--border);

    position:sticky;

    top:0;

    z-index:100;
}

.title{
    font-size:20px;

    font-weight:bold;

    color:var(--green);
}

.logout{
    border:0;

    background:var(--green);

    color:white;

    padding:10px 17px;

    border-radius:8px;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.logout:hover{
    transform:translateY(-1px);
}


/* =========================
   MAIN
========================= */

.container{
    width:100%;

    max-width:650px;

    margin:auto;

    padding:22px 16px 40px;
}


/* =========================
   USERNAME PASSWORD
========================= */

.top{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:12px;
}

.box{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;
}

.label{
    font-size:12px;

    font-weight:bold;

    color:var(--muted);

    margin-bottom:7px;
}

.value{
    font-size:16px;

    font-weight:bold;

    color:var(--text);
}


/* =========================
   MAC
========================= */

.mac-box{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:18px;
}

.mac-title{
    font-size:12px;

    color:var(--muted);

    font-weight:bold;

    margin-bottom:7px;
}

.mac-value{
    font-size:17px;

    font-weight:bold;

    color:var(--text);

    word-break:break-all;
}


/* =========================
   PHOTO
========================= */

.photo-box{
    width:100%;

    display:flex;

    justify-content:center;

    margin:5px 0 22px;
}

.photo{
    width:220px;

    height:220px;

    border-radius:50%;

    overflow:hidden;

    background:#dff0e8;

    border:6px solid var(--card);

    box-shadow:
        0 7px 30px rgba(0,0,0,.18);
}

.photo svg{
    width:100%;

    height:100%;

    display:block;
}


/* =====================================================
   PREMIUM SPEED BOX
===================================================== */

.speed-box{

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--bg)
        );

    border:1px solid var(--border);

    border-radius:18px;

    padding:17px;

    margin-bottom:14px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.06);

}


/* decorative glow */

.speed-box::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    top:-90px;
    right:-70px;

    background:
        radial-gradient(
            circle,
            rgba(11,93,59,.12),
            transparent 70%
        );

    pointer-events:none;
}


/* =========================
   SPEED HEADER
========================= */

.speed-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

    position:relative;

    z-index:2;
}

.speed-title{

    font-size:14px;

    font-weight:bold;

    color:var(--muted);

    letter-spacing:.3px;
}

.speed-live{

    display:flex;

    align-items:center;

    gap:5px;

    font-size:10px;

    font-weight:bold;

    color:#08783d;

    background:#e8f7ef;

    padding:6px 9px;

    border-radius:20px;

    box-shadow:
        0 3px 10px rgba(8,120,61,.08);
}

.live-dot{

    width:6px;

    height:6px;

    background:#0aa854;

    border-radius:50%;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{

    0%{
        opacity:.4;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.2);
    }

    100%{
        opacity:.4;
        transform:scale(.8);
    }

}


/* =====================================================
   SPEED VALUE CARDS
===================================================== */

.speed-values{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:15px;

    position:relative;

    z-index:2;
}

.speed-value-box{

    position:relative;

    overflow:hidden;

    border:1px solid var(--border);

    border-radius:13px;

    padding:13px;

    background:rgba(255,255,255,.04);

    backdrop-filter:blur(8px);

}

.speed-value-box::after{

    content:"";

    position:absolute;

    width:50px;

    height:50px;

    border-radius:50%;

    right:-20px;

    bottom:-20px;

    opacity:.08;

}

.download-card::after{
    background:#e00000;
}

.upload-card::after{
    background:#0b9b54;
}

.speed-value-title{

    font-size:10px;

    font-weight:bold;

    margin-bottom:5px;

    letter-spacing:.5px;
}

.download-title{
    color:#e00000;
}

.upload-title{
    color:#0b9b54;
}

.speed-number-row{

    display:flex;

    align-items:baseline;

    gap:5px;
}

.speed-value{

    font-size:25px;

    font-weight:bold;

    color:var(--text);

    letter-spacing:-.5px;
}

.speed-unit{

    font-size:10px;

    color:var(--muted);

    font-weight:bold;
}


/* =====================================================
   GRAPH LEGEND
===================================================== */

.graph-legend{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:28px;

    margin-bottom:9px;

    position:relative;

    z-index:2;
}

.legend{

    display:flex;

    align-items:center;

    gap:6px;

    font-size:11px;

    font-weight:bold;

    color:var(--text);
}

.legend-line{

    width:24px;

    height:3px;

    border-radius:20px;
}

.download-line{
    background:#e00000;

    box-shadow:
        0 0 7px rgba(224,0,0,.4);
}

.upload-line{
    background:#0b9b54;

    box-shadow:
        0 0 7px rgba(11,155,84,.4);
}


/* =====================================================
   GRAPH
===================================================== */

.graph-container{

    width:100%;

    height:200px;

    position:relative;

    border-radius:13px;

    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            rgba(128,128,128,.025),
            rgba(128,128,128,.08)
        );

    border:1px solid var(--border);

}

#speedCanvas{

    width:100%;

    height:100%;

    display:block;
}


/* graph fade */

.graph-container::after{

    content:"";

    position:absolute;

    left:0;

    right:0;

    bottom:0;

    height:25px;

    background:
        linear-gradient(
            transparent,
            var(--bg)
        );

    opacity:.18;

    pointer-events:none;
}


.speed-note{

    text-align:center;

    font-size:10px;

    color:var(--muted);

    margin-top:8px;
}


/* =========================
   INFO
========================= */

.info,
.billing,
.bill,
.address,
.connection{

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;

    padding:15px;

    margin-bottom:12px;
}

.info-title{

    font-size:12px;

    color:var(--muted);

    font-weight:bold;

    margin-bottom:7px;
}

.info-value{

    font-size:17px;

    font-weight:bold;

    line-height:1.4;

    color:var(--text);
}

.bill-value{

    font-size:22px;

    font-weight:bold;

    color:var(--green);
}


/* =========================
   ONLINE
========================= */

.online{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:7px 11px;

    background:#e8f7ef;

    color:#08783d;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;
}

.online-dot{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#0aa854;

    box-shadow:
        0 0 7px #0aa854;

    animation:onlinePulse 1.3s infinite;
}

@keyframes onlinePulse{

    0%,100%{
        opacity:.6;
    }

    50%{
        opacity:1;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .header{

        height:60px;

        padding:0 14px;
    }

    .title{

        font-size:18px;
    }

    .logout{

        padding:9px 13px;
    }

    .container{

        padding:18px 13px 30px;
    }

    .photo{

        width:200px;

        height:200px;
    }

    .value{

        font-size:14px;
    }

    .mac-value{

        font-size:15px;
    }

    .info-value{

        font-size:15px;
    }

    .speed-value{

        font-size:21px;
    }

    .graph-container{

        height:185px;
    }

}

</style>

</head>

<script>


/* =====================================================
   LOGIN
===================================================== */

if(
    sessionStorage.getItem("loggedIn")
    !== "true"
){

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   USERNAME
===================================================== */

const savedUsername =
sessionStorage.getItem(
    "username"
);

if(savedUsername){

    document.getElementById(
        "username"
    ).textContent =
    savedUsername;

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    sessionStorage.removeItem(
        "loggedIn"
    );

    sessionStorage.removeItem(
        "username"
    );

    window.location.replace(
        "index.html"
    );

}


/* =====================================================
   THEME
===================================================== */

const themeButton =
document.getElementById(
    "themeButton"
);


function loadTheme(){

    const theme =
    localStorage.getItem(
        "customerTheme"
    );


    if(theme === "dark"){

        document.body.classList.add(
            "dark"
        );

        themeButton.textContent =
        "☀";

    }

}


function toggleTheme(){

    document.body.classList.toggle(
        "dark"
    );


    const dark =
    document.body.classList.contains(
        "dark"
    );


    localStorage.setItem(
        "customerTheme",
        dark
        ? "dark"
        : "light"
    );


    themeButton.textContent =
    dark
    ? "☀"
    : "☾";


    drawGraph();

}


loadTheme();


/* =====================================================
   GRAPH
===================================================== */

const canvas =
document.getElementById(
    "speedCanvas"
);

const ctx =
canvas.getContext("2d");


const downloadElement =
document.getElementById(
    "downloadSpeed"
);

const uploadElement =
document.getElementById(
    "uploadSpeed"
);


let downloadHistory = [];

let uploadHistory = [];

const MAX_POINTS = 80;


/* =====================================================
   INITIAL SPEED
===================================================== */

let download = 7.2;

let upload = 1.5;


/* =====================================================
   SMOOTH RANDOM SPEED
===================================================== */

function changeSpeed(
    current,
    min,
    max,
    step
){

    let next =
    current +
    (
        Math.random() * 2 - 1
    ) * step;


    if(next < min){

        next =
        min +
        Math.random() * step;

    }


    if(next > max){

        next =
        max -
        Math.random() * step;

    }


    return next;

}


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas(){

    const rect =
    canvas.parentElement
    .getBoundingClientRect();


    const ratio =
    window.devicePixelRatio || 1;


    canvas.width =
    rect.width * ratio;


    canvas.height =
    rect.height * ratio;


    canvas.style.width =
    rect.width + "px";


    canvas.style.height =
    rect.height + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   DRAW GRAPH
===================================================== */

function drawGraph(){

    const width =
    canvas.clientWidth;


    const height =
    canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if(
        downloadHistory.length < 2
    ){

        return;

    }


    const dark =
    document.body.classList.contains(
        "dark"
    );


    /* =========================
       GRID
    ========================= */

    ctx.lineWidth = 1;

    ctx.strokeStyle =
    dark
    ? "rgba(255,255,255,.06)"
    : "rgba(0,0,0,.06)";


    for(
        let i = 1;
        i < 6;
        i++
    ){

        const y =
        (
            height / 6
        ) * i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /* =========================
       FIXED SCALE
    ========================= */

    const max =
    12;


    drawSmoothLine(
        downloadHistory,
        "#e00000",
        width,
        height,
        max
    );


    drawSmoothLine(
        uploadHistory,
        "#0b9b54",
        width,
        height,
        max
    );

}


/* =====================================================
   SMOOTH LINE
===================================================== */

function drawSmoothLine(
    data,
    color,
    width,
    height,
    max
){

    if(
        data.length < 2
    ){

        return;

    }


    const points = [];


    data.forEach(
        function(
            value,
            index
        ){

            const x =
            (
                index /
                (data.length - 1)
            ) * width;


            const y =
            height -
            (
                value / max
            ) *
            (
                height - 22
            ) -
            11;


            points.push({
                x:x,
                y:y
            });

        }
    );


    /* =========================
       AREA
    ========================= */

    ctx.beginPath();

    ctx.moveTo(
        points[0].x,
        height
    );

    ctx.lineTo(
        points[0].x,
        points[0].y
    );


    for(
        let i = 1;
        i < points.length;
        i++
    ){

        const previous =
        points[i - 1];

        const current =
        points[i];


        const midX =
        (
            previous.x +
            current.x
        ) / 2;


        ctx.quadraticCurveTo(
            previous.x,
            previous.y,
            midX,
            (
                previous.y +
                current.y
            ) / 2
        );

    }


    const last =
    points[
        points.length - 1
    ];


    ctx.lineTo(
        last.x,
        last.y
    );

    ctx.lineTo(
        last.x,
        height
    );

    ctx.closePath();


    if(color === "#e00000"){

        const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


        gradient.addColorStop(
            0,
            "rgba(224,0,0,.13)"
        );

        gradient.addColorStop(
            1,
            "rgba(224,0,0,0)"
        );


        ctx.fillStyle =
        gradient;

    }
    else{

        const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );


        gradient.addColorStop(
            0,
            "rgba(11,155,84,.13)"
        );

        gradient.addColorStop(
            1,
            "rgba(11,155,84,0)"
        );


        ctx.fillStyle =
        gradient;

    }


    ctx.fill();


    /* =========================
       LINE
    ========================= */

    ctx.beginPath();

    ctx.moveTo(
        points[0].x,
        points[0].y
    );


    for(
        let i = 1;
        i < points.length;
        i++
    ){

        const previous =
        points[i - 1];

        const current =
        points[i];


        const midX =
        (
            previous.x +
            current.x
        ) / 2;


        ctx.quadraticCurveTo(
            previous.x,
            previous.y,
            midX,
            (
                previous.y +
                current.y
            ) / 2
        );

    }


    ctx.lineTo(
        last.x,
        last.y
    );


    ctx.strokeStyle =
    color;

    ctx.lineWidth = 3;

    ctx.lineJoin =
    "round";

    ctx.lineCap =
    "round";

    ctx.shadowBlur = 8;

    ctx.shadowColor =
    color;

    ctx.stroke();

    ctx.shadowBlur = 0;


    /* =================================================
       CURRENT POINT

       Point ডান edge থেকে 2 point আগে
    ================================================= */

    const lastIndex =
    data.length - 1;


    const pointIndex =
    Math.max(
        0,
        lastIndex - 2
    );


    const point =
    points[
        pointIndex
    ];


    /* glow */

    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        9,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
    color === "#e00000"
    ? "rgba(224,0,0,.14)"
    : "rgba(11,155,84,.14)";


    ctx.fill();


    /* white ring */

    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        5,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
    "#ffffff";

    ctx.fill();


    /* main point */

    ctx.beginPath();

    ctx.arc(
        point.x,
        point.y,
        3.5,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
    color;

    ctx.fill();

}


/* =====================================================
   UPDATE SPEED
===================================================== */

function updateSpeed(){

    download =
    changeSpeed(
        download,
        4.5,
        9.5,
        0.18
    );


    upload =
    changeSpeed(
        upload,
        0.6,
        2.2,
        0.07
    );


    downloadElement.textContent =
    download.toFixed(1);


    uploadElement.textContent =
    upload.toFixed(1);


    downloadHistory.push(
        download
    );


    uploadHistory.push(
        upload
    );


    if(
        downloadHistory.length >
        MAX_POINTS
    ){

        downloadHistory.shift();

    }


    if(
        uploadHistory.length >
        MAX_POINTS
    ){

        uploadHistory.shift();

    }


    drawGraph();

}


/* =====================================================
   START
===================================================== */

resizeCanvas();


/*
   Smooth update
   প্রতি 200ms
*/

setInterval(
    updateSpeed,
    200
);


</script>
