<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f8;
    color:#222;
}


/* =========================
   HEADER
========================= */

.header{
    height:65px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #e5e5e5;
    position:sticky;
    top:0;
    z-index:100;
}

.title{
    font-size:20px;
    font-weight:bold;
    color:#0b5d3b;
}

.logout{
    border:0;
    background:#0b5d3b;
    color:#fff;
    padding:10px 17px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.logout:hover{
    background:#08492f;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:22px 16px 40px;
}


/* =========================
   USERNAME PASSWORD
========================= */

.top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:12px;
}

.box{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
}

.label{
    font-size:12px;
    font-weight:bold;
    color:#777;
    margin-bottom:7px;
}

.value{
    font-size:16px;
    font-weight:bold;
    color:#222;
    word-break:break-word;
}


/* =========================
   MAC
========================= */

.mac-box{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:18px;
}

.mac-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.mac-value{
    font-size:17px;
    font-weight:bold;
    color:#222;
    word-break:break-all;
}


/* =========================
   PHOTO
========================= */

.photo-box{
    width:100%;
    display:flex;
    justify-content:center;
    margin:8px 0 22px;
}

.photo{
    width:220px;
    height:220px;
    border-radius:50%;
    overflow:hidden;
    background:#e5e5e5;
    border:6px solid #fff;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =========================
   SPEED GRAPH
========================= */

.speed-box{
    background:#fff;
    border:1px solid #ddd;
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
}

.speed-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.speed-title{
    font-size:14px;
    font-weight:bold;
    color:#555;
}

.speed-live{
    font-size:11px;
    font-weight:bold;
    color:#08783d;
    background:#e8f7ef;
    padding:5px 9px;
    border-radius:6px;
}

.speed-current{
    text-align:center;
    margin:5px 0 18px;
}

.speed-number{
    font-size:38px;
    font-weight:bold;
    color:#0b5d3b;
}

.speed-unit{
    font-size:15px;
    color:#777;
    margin-left:4px;
    font-weight:bold;
}

.graph-container{
    width:100%;
    height:180px;
    position:relative;
    border-radius:10px;
    background:#f8faf9;
    overflow:hidden;
}

#speedCanvas{
    width:100%;
    height:100%;
    display:block;
}

.speed-note{
    text-align:center;
    font-size:11px;
    color:#999;
    margin-top:8px;
}


/* =========================
   INFORMATION BOX
========================= */

.info{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.info-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.info-value{
    font-size:17px;
    font-weight:bold;
    line-height:1.4;
}


/* =========================
   BILL
========================= */

.bill{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.bill-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:6px;
}

.bill-value{
    font-size:22px;
    font-weight:bold;
    color:#0b5d3b;
}


/* =========================
   BILLING DATE
========================= */

.billing-date{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.billing-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:7px;
}

.billing-value{
    font-size:18px;
    font-weight:bold;
    color:#222;
}


/* =========================
   CONNECTION STATUS
========================= */

.connection{
    background:#fff;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.connection-title{
    font-size:12px;
    color:#777;
    font-weight:bold;
    margin-bottom:8px;
}

.online{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    background:#e8f7ef;
    color:#08783d;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
}

.online-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#0aa854;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .header{
        height:60px;
        padding:0 14px;
    }

    .title{
        font-size:18px;
    }

    .logout{
        padding:9px 13px;
    }

    .container{
        padding:18px 13px 30px;
    }

    .photo{
        width:200px;
        height:200px;
    }

    .value{
        font-size:14px;
    }

    .mac-value{
        font-size:15px;
    }

    .info-value{
        font-size:15px;
    }

    .billing-value{
        font-size:16px;
    }

    .speed-number{
        font-size:34px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="title">
        Customer Portal
    </div>

    <button
        class="logout"
        onclick="logout()">
        Logout
    </button>

</div>



<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- =========================
         USERNAME + PASSWORD
    ========================= -->

    <div class="top">

        <div class="box">

            <div class="label">
                USERNAME
            </div>

            <div
                class="value"
                id="username">
                ADMIN
            </div>

        </div>


        <div class="box">

            <div class="label">
                PASSWORD
            </div>

            <div
                class="value"
                id="password">
                12345
            </div>

        </div>

    </div>



    <!-- =========================
         MAC
    ========================= -->

    <div class="mac-box">

        <div class="mac-title">
            MAC
        </div>

        <div class="mac-value">
            22:91:fb:b1:a5:41
        </div>

    </div>



    <!-- =========================
         PHOTO
    ========================= -->

    <div class="photo-box">

        <div class="photo">

            <img
                id="profilePhoto"
                src="https://via.placeholder.com/500"
                alt="Customer Photo">

        </div>

    </div>



    <!-- =========================
         INTERNET SPEED
    ========================= -->

    <div class="speed-box">

        <div class="speed-header">

            <div class="speed-title">
                📶 INTERNET SPEED
            </div>

            <div
                class="speed-live"
                id="speedStatus">
                ● LIVE
            </div>

        </div>


        <div class="speed-current">

            <span
                class="speed-number"
                id="speedNumber">
                --
            </span>

            <span class="speed-unit">
                Mbps
            </span>

        </div>


        <div class="graph-container">

            <canvas id="speedCanvas"></canvas>

        </div>


        <div class="speed-note">
            Estimated network speed • Updates every 2 seconds
        </div>

    </div>



    <!-- =========================
         NAME
    ========================= -->

    <div class="info">

        <div class="info-title">
            NAME
        </div>

        <div class="info-value">
            Shemanto Islam
        </div>

    </div>



    <!-- =========================
         BILLING DATE
    ========================= -->

    <div class="billing-date">

        <div class="billing-title">
            BILLING DATE
        </div>

        <div class="billing-value">
            01-01-2027
        </div>

    </div>



    <!-- =========================
         BILL
    ========================= -->

    <div class="bill">

        <div class="bill-title">
            BILL
        </div>

        <div class="bill-value">
            500 tk
        </div>

    </div>



    <!-- =========================
         ADDRESS
    ========================= -->

    <div class="info">

        <div class="info-title">
            ADDRESS
        </div>

        <div class="info-value">
            sagorika road pahartali Chittagong
        </div>

    </div>



    <!-- =========================
         CONNECTION STATUS
    ========================= -->

    <div class="connection">

        <div class="connection-title">
            CONNECTING STATUS
        </div>

        <div class="online">

            <span class="online-dot"></span>

            Online

        </div>

    </div>


</div>



<script>


/* =====================================================
   LOGIN CHECK
===================================================== */

if(sessionStorage.getItem("loggedIn") !== "true"){

    window.location.replace("index.html");

}


/* =====================================================
   USERNAME
===================================================== */

const savedUsername =
    sessionStorage.getItem("username");

if(savedUsername){

    document.getElementById("username")
    .textContent = savedUsername;

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    sessionStorage.removeItem("loggedIn");

    sessionStorage.removeItem("username");

    window.location.replace("index.html");

}


/* =====================================================
   SPEED GRAPH
===================================================== */

const canvas =
    document.getElementById("speedCanvas");

const ctx =
    canvas.getContext("2d");

const speedNumber =
    document.getElementById("speedNumber");

const speedStatus =
    document.getElementById("speedStatus");


let speedHistory = [];

const MAX_POINTS = 30;


/* =====================================================
   CANVAS SIZE
===================================================== */

function resizeCanvas(){

    const rect =
        canvas.parentElement.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * ratio;

    canvas.height =
        rect.height * ratio;

    canvas.style.width =
        rect.width + "px";

    canvas.style.height =
        rect.height + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    drawGraph();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   GET SPEED
===================================================== */

function getCurrentSpeed(){

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;


    if(
        connection &&
        typeof connection.downlink === "number"
    ){

        return connection.downlink;

    }


    return null;

}


/* =====================================================
   UPDATE SPEED
===================================================== */

function updateSpeed(){

    const speed =
        getCurrentSpeed();


    if(speed === null){

        speedNumber.textContent =
            "--";

        speedStatus.textContent =
            "● NOT SUPPORTED";

        speedStatus.style.color =
            "#777";

        speedStatus.style.background =
            "#eeeeee";

        return;

    }


    speedNumber.textContent =
        speed.toFixed(1);


    speedStatus.textContent =
        "● LIVE";

    speedStatus.style.color =
        "#08783d";

    speedStatus.style.background =
        "#e8f7ef";


    speedHistory.push(speed);


    if(speedHistory.length > MAX_POINTS){

        speedHistory.shift();

    }


    drawGraph();

}


/* =====================================================
   DRAW GRAPH
===================================================== */

function drawGraph(){

    const width =
        canvas.parentElement.clientWidth;

    const height =
        canvas.parentElement.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if(speedHistory.length === 0){

        return;

    }


    let maxSpeed =
        Math.max(...speedHistory);


    if(maxSpeed < 10){

        maxSpeed = 10;

    }
    else{

        maxSpeed =
            Math.ceil(maxSpeed / 5) * 5;

    }


    /* =========================
       GRID
    ========================= */

    ctx.strokeStyle =
        "#e4e9e6";

    ctx.lineWidth = 1;


    for(let i = 1; i < 5; i++){

        const y =
            (height / 5) * i;

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /* =========================
       GRAPH LINE
    ========================= */

    ctx.beginPath();


    speedHistory.forEach(
        (speed,index)=>{

            const x =
                speedHistory.length === 1
                ? width / 2
                : (
                    index /
                    (speedHistory.length - 1)
                ) * width;


            const y =
                height -
                (
                    (speed / maxSpeed) *
                    (height - 15)
                ) -
                7;


            if(index === 0){

                ctx.moveTo(
                    x,
                    y
                );

            }
            else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#0b5d3b";

    ctx.lineWidth = 3;

    ctx.lineJoin =
        "round";

    ctx.lineCap =
        "round";

    ctx.stroke();


    /* =========================
       CURRENT POINT
    ========================= */

    const lastIndex =
        speedHistory.length - 1;

    const lastSpeed =
        speedHistory[lastIndex];


    const lastX =
        speedHistory.length === 1
        ? width / 2
        : (
            lastIndex /
            (speedHistory.length - 1)
        ) * width;


    const lastY =
        height -
        (
            (lastSpeed / maxSpeed) *
            (height - 15)
        ) -
        7;


    ctx.beginPath();

    ctx.arc(
        lastX,
        lastY,
        5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#0b5d3b";

    ctx.fill();

}


/* =====================================================
   START
===================================================== */

resizeCanvas();

updateSpeed();


setInterval(
    updateSpeed,
    2000
);


</script>


</body>
</html>
